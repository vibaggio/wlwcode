      <div className="panel">
        <div className="section-title">{en?"What it is":"O que é"}</div>
        <p className="small" style={{marginTop:0}}>{en
          ? "Each card features a real Brazilian animal, with photos by nature photographers, joining biological information with the joy of collecting. Cards are generated one by one, so almost no two are alike."
          : "Cada carta traz um animal brasileiro real, com fotos de fotógrafos de natureza, unindo informação biológica ao prazer de colecionar. As cartas são geradas uma a uma, então quase nenhuma é igual à outra."}</p>
        <ul className="small" style={{marginTop:6,paddingLeft:18,lineHeight:1.7}}>
          {(en ? [
            "Real species, with biology and conservation status.",
            "Photos credited to their photographers.",
            "Learn by playing a quiz about the fauna.",
            "Part of any future proceeds supports conservation and photographers.",
          ] : [
            "Espécies reais, com biologia e estado de conservação.",
            "Fotos creditadas aos seus fotógrafos.",
            "Aprenda jogando um quiz sobre a fauna.",
            "Parte de qualquer arrecadação futura apoia a conservação e os fotógrafos.",
          ]).map((x,i)=><li key={i}>{x}</li>)}
        </ul>
      </div>

      <div className="panel" style={{borderColor:"var(--accent)"}}>
        <div className="section-title">{en?"Early closed access":"Acesso antecipado e fechado"}</div>
        <p className="small" style={{marginTop:0,marginBottom:0}}>{en
          ? "This is a closed test version. After signing in you will be asked to accept a short confidentiality agreement before playing."
          : "Esta é uma versão de teste fechada. Após entrar, será pedido o aceite de um termo de confidencialidade antes de jogar."}</p>
      </div>

      <div className="panel">
        <div className="section-title">{en?"Privacy":"Privacidade"}</div>
        <p className="small muted" style={{marginTop:0,marginBottom:0}}>{en
          ? "To create your account we collect only your email and a username. Your email is used for sign-in and account recovery, and is not shared."
          : "Para criar sua conta coletamos apenas seu email e um nome de usuário. O email é usado para login e recuperação de conta, e não é compartilhado."}</p>
      </div>

      <div style={{textAlign:"center",margin:"4px 0 8px"}}>
        <button onClick={onEnter} style={{minWidth:220}}>{en?"Enter the game":"Acessar o jogo"}</button>
      </div>
    </div>
  );
}

function NDAGate({ lang, onAccepted }){
  const en = lang==="en";
  const [agree,setAgree]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  async function accept(){
    if(!agree||busy) return; setBusy(true); setErr("");
    try{ const { error }=await db.rpc("app_accept_nda"); if(error) throw error; onAccepted&&onAccepted(); }
    catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  return (
    <div className="wrap">
      <div className="panel">
        <div style={{fontWeight:800,fontSize:20,marginBottom:4}}>{en?"Confidentiality agreement":"Termo de confidencialidade"}</div>
        <p className="muted small" style={{marginTop:0}}>{en
          ? "Before entering the closed test, please read and accept the terms below."
          : "Antes de entrar no teste fechado, leia e aceite os termos abaixo."}</p>
        <div style={{maxHeight:300,overflow:"auto",border:"1px solid var(--line)",borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.6}}>
          {(en ? NDA_EN : NDA_PT).map((p,i)=><p key={i} style={{margin:i?"10px 0 0":"0"}}>{p}</p>)}
        </div>
        <label style={{display:"flex",alignItems:"flex-start",gap:8,marginTop:12,cursor:"pointer"}}>
          <input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)} style={{marginTop:3}} />
          <span className="small">{en?"I have read and accept the confidentiality agreement.":"Li e aceito o termo de confidencialidade."}</span>
        </label>
        {err && <div className="err">{err}</div>}
        <button onClick={accept} disabled={!agree||busy} style={{marginTop:12,width:"100%"}}>{busy?(en?"Saving...":"Salvando..."):(en?"Accept and enter":"Aceitar e entrar")}</button>
        <p className="small muted" style={{marginTop:10,marginBottom:0}}>{en
          ? "Simplified document, not legal advice."
          : "Documento simplificado, não constitui aconselhamento jurídico."}</p>
      </div>
    </div>
  );
}

function App() {
  const [session,setSession]=useState(undefined);
  const [lang,setLang]=useState("pt");
  const [showAuth,setShowAuth]=useState(false);
  const [cb,setCb]=useState(()=>parseAuthCallback());
  useEffect(()=>{
    db.auth.getSession().then(({data})=>setSession(data.session));
    const { data:sub }=db.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=> sub.subscription.unsubscribe();
  },[]);
  if(session===undefined) return <div className="wrap"><p className="muted">{tr(lang,"loading")}</p></div>;
  if(cb && cb.isCallback) return <AuthCallback cb={cb} session={session} lang={lang} setLang={setLang} onContinue={()=>setCb(null)} />;
  if(session) return <Main session={session} lang={lang} setLang={setLang} />;
  return showAuth
    ? <Auth lang={lang} setLang={setLang} onBack={()=>setShowAuth(false)} />
    : <Landing lang={lang} setLang={setLang} onEnter={()=>setShowAuth(true)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

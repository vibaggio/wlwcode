<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WildLens · Fauna do Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ece1cd; --panel:#faf4e8; --panel2:#f3ead8; --line:#d3c4a6;
    --text:#23291b; --muted:#6f6753; --accent:#1f6e49; --amber:#e6a53c;

    /* WildLens design system (Claude Design) — tokens aditivos */
    --wl-inset:#e7dcc4; --border-strong:#c2b08c; --on-accent:#f7f2e8;
    --accent-ink:#165236; --amber-ink:#c4862a;

    --font-display:'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-body:'Nunito Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

    --fs-display:2.5rem; --fs-h1:1.875rem; --fs-h2:1.5rem; --fs-h3:1.25rem;
    --fs-body-lg:1.0625rem; --fs-body:1rem; --fs-sm:.875rem; --fs-xs:.75rem; --fs-2xs:.6875rem;

    --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem;
    --space-5:1.25rem; --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem; --space-12:3rem;

    --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:18px;
    --radius-card:16px; --radius-pill:999px;

    --shadow-xs:0 1px 2px rgba(35,41,27,.06);
    --shadow-sm:0 2px 6px rgba(35,41,27,.08);
    --shadow-md:0 6px 16px rgba(35,41,27,.10);
    --shadow-lg:0 14px 34px rgba(35,41,27,.16);
    --scrim:rgba(20,24,14,.45);

    --ease-out:cubic-bezier(.2,.7,.3,1); --ease-soft:cubic-bezier(.34,1.3,.55,1);
    --dur-fast:120ms; --dur-base:200ms; --dur-slow:320ms;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:var(--font-body); }
  .wrap { max-width:1040px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:0; letter-spacing:.3px; font-family:var(--font-display); }
  .muted { color:var(--muted); } .small { font-size:13px; }
  button { background:var(--accent); color:#f7f2e8; border:0; border-radius:8px;
           padding:10px 16px; font-size:15px; cursor:pointer; font-weight:600; }
  button:not(:disabled):hover { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  input { width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
          background:#e7dcc4; color:var(--text); font-size:15px; margin-top:6px; }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px #1f6e4924; }
  input[type=checkbox] { width:18px; min-width:18px; height:18px; flex:0 0 auto; padding:0; margin:2px 0 0; accent-color:var(--accent); }
  .field { margin-bottom:12px; } .field label { font-size:13px; color:var(--muted); }
  .auth { max-width:380px; margin:60px auto; background:var(--panel);
          border:1px solid var(--line); border-radius:14px; padding:26px; }
  .topbar { display:flex; align-items:center; justify-content:space-between;
            gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .stats { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .xpbar { width:88px; height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:3px; }
  .xpbar span { display:block; height:100%; background:var(--accent); border-radius:4px; transition:width .4s ease; }
  .stat b { font-size:17px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .tab { padding:9px 14px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; font-weight:600; font-size:14px; }
  .tab.active { color:var(--text); border-bottom-color:var(--amber); }
  .navmenu { position:absolute; top:100%; left:0; margin-top:6px; background:var(--panel);
             border:1px solid var(--line); border-radius:10px; padding:6px; min-width:172px;
             box-shadow:0 10px 26px #000a; z-index:50; }
  .navmenu-item { padding:8px 10px; border-radius:7px; cursor:pointer; color:var(--muted);
             font-size:14px; font-weight:600; white-space:nowrap; }
  .navmenu-item:hover { background:var(--panel2); color:var(--text); }
  .navmenu-item.on { color:var(--text); background:var(--panel2); }
  .navmenu-item.off { opacity:.5; cursor:default; }
  .albumgrid { display:flex; flex-wrap:wrap; gap:8px; }
  .choosegrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:12px; }
  .choosecard { display:flex; flex-direction:column; }
  .albent { width:84px; text-align:center; }
  .albent .thumb { width:84px; height:64px; border-radius:8px; border:1px solid var(--line);
             object-fit:cover; display:block; background:#e7dcc4; }
  .albent .miss { width:84px; height:64px; border-radius:8px; border:1px dashed var(--line);
             display:flex; align-items:center; justify-content:center; color:var(--muted);
             font-size:20px; background:#e7dcc4; }
  .albent .nm { font-size:10px; margin-top:3px; white-space:nowrap; overflow:hidden;
             text-overflow:ellipsis; color:var(--muted); }
  .albent.has .nm { color:var(--text); font-weight:600; }
  .albent.dim { opacity:.55; }
  .albent.ready .miss { border:1px solid var(--accent); color:var(--accent); }
  .albent.ready .nm { color:var(--text); }
  .pastebtn { margin-top:4px; width:84px; font-size:10px; padding:3px 0; border-radius:6px;
             background:var(--accent); color:#f7f2e8; border:none; cursor:pointer; font-weight:700; }
  .pastebtn:disabled { opacity:.6; cursor:default; }
  .seg { display:inline-flex; gap:4px; background:var(--panel2); border:1px solid var(--line);
             border-radius:9px; padding:3px; }
  .seg button { background:transparent; border:none; padding:6px 12px; border-radius:7px;
             color:var(--muted); font-weight:600; font-size:13px; cursor:pointer; }
  .seg button.on { background:var(--accent); color:#f7f2e8; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:22px; box-shadow:0 1px 2px rgba(70,55,30,.05), 0 4px 14px rgba(70,55,30,.04); }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); }
  .selcard { position:relative; cursor:pointer; border-radius:14px; }
  .selcard.on { outline:3px solid var(--accent); outline-offset:3px; }
  .selcard .selmark { position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background:var(--accent); color:#f7f2e8; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; box-shadow:0 2px 6px #0005; opacity:0; transition:opacity .12s ease; }
  .selcard.on .selmark { opacity:1; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(70,55,30,.06), 0 4px 12px rgba(70,55,30,.05); }
  .card .photo { height:120px; display:flex; align-items:center; justify-content:center; text-align:center; padding:8px; font-weight:700; }
  .card .body { padding:11px 12px 13px; }
  .sci { font-style:italic; }
  .card .sci { font-style:italic; color:var(--muted); font-size:12px; margin-top:2px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin:9px 0; }
  .badge { font-size:11px; padding:3px 8px; border-radius:20px; font-weight:700; }
  .floatbar { height:6px; background:#e7dcc4; border-radius:4px; overflow:hidden; margin-top:4px; }
  .floatbar > span { display:block; height:100%; }
  .attrs { margin-top:9px; font-size:12.5px; color:var(--muted); line-height:1.7; }
  .attrs b { color:var(--text); font-weight:600; }
  .err { color:#c0413c; font-size:14px; margin-top:10px; }
  .ok { color:#2f9e57; font-size:14px; margin-top:10px; }
  .reveal { border:1px solid var(--accent); }
  .section-title { font-size:15px; color:var(--muted); margin:0 0 12px; text-transform:uppercase; letter-spacing:.6px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .dots { display:flex; gap:6px; }
  .dot { font-size:11px; padding:2px 7px; border-radius:12px; font-weight:700; }
  .opt { display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line);
         color:var(--text); padding:13px 14px; border-radius:10px; margin-bottom:10px; cursor:pointer; font-size:15px; }
  .opt:hover:enabled { border-color:var(--accent); }
  .opt.correct { border-color:#3fb950; background:#3fb95018; }
  .opt.wrong { border-color:#ff7b72; background:#ff7b7218; }
  .diffseal { font-size:11px; font-weight:700; padding:2px 8px; border-radius:8px; border:1px solid; white-space:nowrap; }
  .timer { font-weight:700; }
  .pbar { height:8px; background:#e7dcc4; border-radius:5px; overflow:hidden; margin-top:6px; }
  .pbar > span { display:block; height:100%; background:var(--accent); }
  .ach { padding:14px 0; border-bottom:1px solid var(--line); }
  .ach:last-child { border-bottom:0; }
  .tcard { position:relative; aspect-ratio:63/88; border-radius:14px; overflow:hidden;
           border:2px solid var(--bcol,#3a4a3f); background:var(--bdark,#1a1d17);
           color:#f5f1e6; --text:#f5f1e6; --muted:#c4cbb8; --line:#ffffff22;
           display:flex; flex-direction:column; box-shadow:0 3px 12px #0008;
           container-type:inline-size; text-align:left; }
  .tcard.reveal { box-shadow:0 0 0 2px #e6a53c, 0 3px 12px #0008; }
  .tcard .titlebar { font-weight:700; font-size:6.3cqw; line-height:1.15; padding:2.3cqw 4.6cqw;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tcard .artwin { position:relative; flex:1; margin:1.1cqw 3.4cqw 0; border:1px solid #00000088;
           border-radius:2.9cqw; overflow:hidden; background:#0d0f0b; }
  .tcard .artwin .img, .tcard .artwin .ph { width:100%; height:100%; object-fit:cover; display:block; }
  .tcard .ph { display:flex; flex-direction:column; align-items:center; justify-content:center;
           text-align:center; gap:1.1cqw; color:#dfe7ee; font-weight:700; font-size:6.3cqw; padding:3.4cqw; }
  .tcard .infobox { flex:0 0 auto; margin:2.9cqw 3.4cqw 3.4cqw; padding:3.4cqw 4cqw; display:flex; flex-direction:column; gap:2.3cqw;
           border:1px solid #ffffff14; border-radius:3.4cqw; background:rgba(0,0,0,.4); }
  .tcard .sci { font-style:italic; color:var(--muted); font-size:5.7cqw;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .statrow { display:flex; gap:5px; }
  .statrow .stat { flex:1; min-width:0; background:#e7dcc4; border:1px solid var(--line);
           border-radius:5px; padding:3px 1px; text-align:center; }
  .statrow .stat .v { font-weight:700; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .statrow .stat .l { font-size:7.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }
  .enc .small { font-size:14px; }
  .enc .statrow { gap:8px; }
  .enc .statrow .stat { min-width:92px; padding:6px 8px; }
  .enc .statrow .stat .v { font-size:15px; white-space:normal; overflow:visible; text-overflow:clip; }
  .enc .statrow .stat .l { font-size:11px; }
  .tcard .statrow { gap:2.9cqw; }
  .tcard .statrow .stat { border-radius:2.9cqw; padding:1.7cqw 0.6cqw; background:rgba(0,0,0,.32); border-color:#ffffff22; }
  .tcard .floatbar { background:rgba(0,0,0,.32); }
  .tcard .statrow .stat .v { font-size:5.6cqw; }
  .tcard .statrow .stat .u { font-size:3.4cqw; font-weight:600; opacity:.72; margin-left:0.4cqw; }
  .tcard .statrow .stat .l { font-size:4.2cqw; }
  .botline { font-size:4.86cqw; color:var(--muted); white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; }
  .rgem { position:absolute; top:3.4cqw; left:3.4cqw; width:8cqw; height:8cqw; border-radius:50%;
           border:2px solid #ffffffcc; box-shadow:0 1px 3px #0009; }
  .biomechip { position:absolute; top:2.9cqw; right:2.9cqw; color:#fff; font-weight:700; font-size:4.86cqw;
           padding:1.1cqw 4cqw; border-radius:5.7cqw; box-shadow:0 1px 3px #0009; max-width:62%;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tcard .fa-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .tcard .fa-scrim { position:absolute; left:0; right:0; bottom:0; padding:4cqw 4.6cqw 5.1cqw;
           background:linear-gradient(transparent, rgba(0,0,0,.55) 28%, rgba(0,0,0,.9));
           display:flex; flex-direction:column; gap:2.3cqw; }
  .tcard .fa-scrim .fa-name { font-weight:800; font-size:7.4cqw; color:#fff;
           overflow:hidden; word-break:break-word;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .tcard .fa-scrim .sci { color:#d3dce4; }
  .tcard.fullart .statrow .stat { background:rgba(0,0,0,.45); border-color:#ffffff33; }
  /* ---- carta emoldurada — estilo Claude Design ---- */
  .tcard.framed { gap:0; }
  .tcard.framed .artwin { flex:1 1 0; min-height:0; margin:3.4cqw 3.4cqw 0; border:none; border-radius:3cqw;
           overflow:hidden; background:linear-gradient(160deg, var(--bcol,#3a4a3f), var(--bdark,#1a1d17)); }
  .tcard.framed .artwin .img { width:100%; height:100%; object-fit:cover; display:block; }
  .tcard.framed .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center;
           padding:3.4cqw; text-align:center; color:rgba(255,255,255,.78); font-weight:700;
           font-size:4.2cqw; letter-spacing:.05em; text-transform:uppercase; }
  .tcard.framed .rdot { position:absolute; top:5cqw; right:5cqw; width:5.2cqw; height:5.2cqw;
           border-radius:50%; background:var(--rcol,#fff); box-shadow:0 1px 3px rgba(0,0,0,.4); z-index:10; }
  .tcard.framed .plate { flex:0 0 auto; margin:2.6cqw 3.4cqw 0; padding:2.9cqw 3.6cqw; background:var(--panel);
           border-radius:3cqw; display:flex; flex-direction:column; gap:1.6cqw;
           --text:#23291b; --muted:#6f6753; --line:#d8cdb2; color:#23291b; }
  .tcard.framed .prow { display:flex; align-items:baseline; justify-content:space-between; gap:2cqw; }
  .tcard.framed .pname { font-family:var(--font-display); font-weight:800; font-size:6.4cqw; line-height:1.05;
           color:#23291b; min-width:0; overflow:hidden; word-break:break-word;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .tcard.framed .pstatus { flex:none; font-weight:700; font-size:3.6cqw; color:#fff; padding:0.6cqw 1.8cqw;
           border-radius:2cqw; letter-spacing:.02em; }
  .tcard.framed .sci { font-style:italic; color:#6f6753; font-size:4.6cqw; line-height:1.1;
           min-width:0; overflow:hidden; word-break:break-word;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .tcard.framed .pfam { flex:none; font-weight:600; font-size:3.8cqw; color:#6f6753; white-space:nowrap; }
  .tcard.framed .statrow { gap:2cqw; margin-top:1.2cqw; padding-top:2.6cqw; border-top:1px solid #d8cdb2; }
  .tcard.framed .statrow .stat { flex:1; min-width:0; background:transparent; border:none;
           border-radius:0; padding:0; text-align:left; }
  .tcard.framed .statrow .stat .v { color:#23291b; font-family:var(--font-display); font-weight:800;
           font-size:6cqw; white-space:nowrap; }
  .tcard.framed .statrow .stat .u { font-size:3.2cqw; font-weight:600; color:#6f6753; margin-left:0.6cqw; opacity:1; }
  .tcard.framed .statrow .stat .l { font-size:3.5cqw; color:#6f6753; text-transform:uppercase;
           letter-spacing:.04em; margin-top:0.3cqw; }
  .tcard.framed .pcred { flex:0 0 auto; margin:1.8cqw 3.6cqw 3cqw; padding-top:1.6cqw;
           border-top:1px solid rgba(255,255,255,.12); font-size:3.3cqw; color:rgba(255,255,255,.6);
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tcard.framed .pfoot { flex:0 0 auto; margin:1.8cqw 3.6cqw 3cqw; padding-top:1.6cqw;
           border-top:1px solid rgba(255,255,255,.12); display:flex; align-items:baseline;
           justify-content:space-between; gap:2cqw; font-size:3.3cqw; color:rgba(255,255,255,.6); }
  .tcard.framed .pfoot .pcred { flex:1 1 auto; margin:0; padding:0; border:none;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .tcard.framed .pfoot .pserial { flex:none; font-weight:700; color:rgba(255,255,255,.74); white-space:nowrap; }
  .tcard .fa-scrim .fa-foot { display:flex; align-items:baseline; justify-content:space-between; gap:2cqw;
           font-size:3.3cqw; color:rgba(255,255,255,.72); margin-top:0.6cqw; }
  .tcard .fa-scrim .fa-foot .fcred { flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .tcard .fa-scrim .fa-foot .pserial { flex:none; font-weight:700; white-space:nowrap; }
  .tcard .statrow .stat .v { overflow:visible; text-overflow:clip; }
  .tcard .statrow .stat .v.vsm { font-size:4.6cqw; }
  .tcard .statrow .stat .v.vxs { font-size:3.8cqw; }
  .tcard.framed .statrow .stat .v.vsm { font-size:4.8cqw; }
  .tcard.framed .statrow .stat .v.vxs { font-size:3.9cqw; }
  .holo { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
          background:linear-gradient(115deg, transparent 25%, rgba(255,255,255,.30) 40%, rgba(120,200,255,.28) 48%, rgba(255,150,230,.26) 56%, transparent 72%);
          background-size:300% 100%; animation:holo 4.5s linear infinite; }
  @keyframes holo { 0%{background-position:0 0;} 100%{background-position:300% 0;} }
  .newshero { min-height:200px; background-size:cover; background-position:center;
              background-color:#123322; display:flex; align-items:flex-end; }
  .newshero-scrim { width:100%; padding:18px; display:flex; flex-direction:column;
              background:linear-gradient(transparent, rgba(0,0,0,.78)); }
  .newsthumb { height:120px; background-size:cover; background-position:center;
              border-radius:8px; margin-bottom:10px; background-color:#10202a; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:flex-start;
             justify-content:center; z-index:50; padding:24px 16px; overflow-y:auto; }
  .modal { width:100%; max-width:420px; }
  .ovbtn.ghost { color:#f4f1e8; border-color:#ffffff66; background:rgba(255,255,255,.1); }
  .ovbtn.ghost:hover { background:rgba(255,255,255,.2); }
  .scene { perspective:1100px; width:300px; margin:0 auto; }
  .tiltwrap { transition:transform .12s ease-out; transform-style:preserve-3d; }
  .flip3d { position:relative; transform-style:preserve-3d; transition:transform .55s; }
  .flip3d.flipped { transform:rotateY(180deg); }
  .face { backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .face.front { transform:rotateY(0deg); }
  .face.back { position:absolute; inset:0; transform:rotateY(180deg); }
  .detrow { display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid var(--line); }
  .detrow:last-child { border-bottom:0; }
  .cardback { width:100%; height:100%; border-radius:14px; border:2px solid var(--line);
              background:radial-gradient(circle at 50% 30%, #1a4634, #0c1f17 78%); display:flex; align-items:center; justify-content:center; }
  .cardback-inner { text-align:center; color:#f4f1e8; display:flex; flex-direction:column; align-items:center; gap:12px; padding:10px; }
  .cardback-brand { font-weight:700; font-size:22px; letter-spacing:3px; }
  .cardback-sub { font-size:13px; color:#bfe3d0; letter-spacing:1px; }
  .photoview { width:100%; }
  .photoview img { width:100%; max-height:62vh; object-fit:contain; border-radius:10px; display:block;
              background:#e7dcc4; border:1px solid var(--line); }
  .photoph { width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;

function parseAuthCallback(){
  const p  = new URLSearchParams(INITIAL_URL.hash.replace(/^#/,""));

  const get = k => p.get(k) || p2.get(k);

}

  const set=new Set();

function filterCards(list, f){
  let r=(list||[]).filter(c=>{
    if(f.q){ const q=f.q.toLowerCase();
      if(!((c.common_name||"").toLowerCase().includes(q) || (c.scientific_name||"").toLowerCase().includes(q))) return false; }
    if(f.rarity && c.rarity_tier!==f.rarity) return false;
    if(f.art && c.art_style_key!==f.art) return false;
    if(f.biome && biomeStyle(c.primary_biome).s!==f.biome) return false;
    return true;
  });
  const fl=c=>Number(c.float_score)||0;
  const pr=c=>Number(c.price_currency)||0;
  const num=(c,k)=>{ const a=c.attributes&&c.attributes[k]; const v=a&&a.value!=null?Number(a.value):NaN; return isNaN(v)?null:v; };
  const byAttr=(k,dir)=>((a,b)=>{ const x=num(a,k), y=num(b,k);
    if(x===null&&y===null) return 0; if(x===null) return 1; if(y===null) return -1;
    return dir==="desc"?(y-x):(x-y); });
  if(f.sort==="float_desc") r=[...r].sort((a,b)=>fl(b)-fl(a));
  else if(f.sort==="float_asc") r=[...r].sort((a,b)=>fl(a)-fl(b));
  else if(f.sort==="name") r=[...r].sort((a,b)=>(a.common_name||"").localeCompare(b.common_name||""));
  else if(f.sort==="price_asc") r=[...r].sort((a,b)=>pr(a)-pr(b));
  else if(f.sort==="price_desc") r=[...r].sort((a,b)=>pr(b)-pr(a));
  else if(f.sort==="mass_desc") r=[...r].sort(byAttr("mass","desc"));
  else if(f.sort==="mass_asc") r=[...r].sort(byAttr("mass","asc"));
  else if(f.sort==="length_desc") r=[...r].sort(byAttr("length","desc"));
  else if(f.sort==="length_asc") r=[...r].sort(byAttr("length","asc"));
  else if(f.sort==="lifespan_desc") r=[...r].sort(byAttr("lifespan","desc"));
  else if(f.sort==="lifespan_asc") r=[...r].sort(byAttr("lifespan","asc"));
  return r;
}

const rarityOf = t => RARITY[t] || RARITY.comum;
const IUCN_BADGE = {
  "pouco preocupante":{code:"LC",color:"#3fb950"},
  "quase ameacada":{code:"NT",color:"#9acd32"},
  "vulneravel":{code:"VU",color:"#f0b429"},
  "em perigo":{code:"EN",color:"#e6852c"},
  "criticamente em perigo":{code:"CR",color:"#e5484d"},
  "extinta na natureza":{code:"EW",color:"#a855f7"},
  "extinta":{code:"EX",color:"#23291b"},
  "dados insuficientes":{code:"DD",color:"#9aa0a6"},
};
function iucnBadge(status){
  if(!status) return null;
  const key = (""+status).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  return IUCN_BADGE[key] || { code: (""+status).length>4 ? (""+status).slice(0,3).toUpperCase() : (""+status), color:"#6b7280" };
}
function conservLabel(status, lang){
  if(!status) return "";
  const key = (""+status).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  const M = { "pouco preocupante":"Pouco preocupante", "quase ameacada":"Quase ameaçada", "vulneravel":"Vulnerável", "em perigo":"Em perigo", "criticamente em perigo":"Criticamente em perigo", "extinta na natureza":"Extinta na natureza", "extinta":"Extinta", "dados insuficientes":"Dados insuficientes" };
  const M_EN = { "pouco preocupante":"Least Concern", "quase ameacada":"Near Threatened", "vulneravel":"Vulnerable", "em perigo":"Endangered", "criticamente em perigo":"Critically Endangered", "extinta na natureza":"Extinct in the Wild", "extinta":"Extinct", "dados insuficientes":"Data Deficient" };
  const dict = lang==="en" ? M_EN : M;
  return dict[key] || status;
}

function fmtRemaining(ms){
  if(ms==null || ms<=0) return "";
  let s=Math.floor(ms/1000);
  const h=Math.floor(s/3600); s-=h*3600;
  const m=Math.floor(s/60); s-=m*60;
  return h+"h "+String(m).padStart(2,"0")+"m "+String(s).padStart(2,"0")+"s";
}

// ===================== CARTA =====================
// Formata o valor de um atributo na carta: nunca mostra zero para valor positivo,
// preserva precisao de valores pequenos (~3 algarismos significativos) e tira zeros sobrando.
function fmtCardValue(raw){
  if(raw===null || raw===undefined || raw==="") return "-";
  const n = Number(raw);
  if(!isFinite(n)) return String(raw);
  if(n===0) return "0";
  const a = Math.abs(n);
  let s;
  if(a>=100) s = String(Math.round(n));
  else if(a>=1) s = n.toFixed(2);
  else {
    let dec = 2 - Math.floor(Math.log10(a));
    dec = Math.min(6, Math.max(2, dec));
    s = n.toFixed(dec);
  }
  if(s.indexOf(".")>=0) s = s.replace(/0+$/,"").replace(/\.$/,"");
  return s;
}

  async function doRelease(){ if(!onRelease) return; setBusy(true); const ok=await onRelease(c.card_id); setBusy(false); if(ok){ onClose(); } }
  async function doPaste(){
    if(!onPaste) return; setPasteMsg(""); setBusy(true);
    const res=await onPaste(c.card_id); setBusy(false);
    if(res && res.ok){ onClose(); return; }
    if(res && res.error==="ja_no_album") setPasteMsg(en?"This species in this biome is already in your album.":"Essa espécie neste bioma já está no seu álbum.");
    else if(res && res.error==="no_mercado") setPasteMsg(en?"Cards listed on the market cannot be pasted.":"Cartas anunciadas no mercado não podem ser coladas.");
    else setPasteMsg(en?"Could not paste the card.":"Não foi possível colar a carta.");
  }
  async function doToggle(){ if(!onToggleTrade) return; setBusy(true); await onToggleTrade(c.card_id, !forTrade); setBusy(false); }
  async function doShowcase(){ if(!onToggleShowcase) return; setScMsg(""); setBusy(true); try{ await onToggleShowcase(c.card_id, !showcase); }catch(e){ setScMsg(e.message||String(e)); } finally{ setBusy(false); } }
  const r=rarityOf(c.rarity_tier);
  const pct=Math.round((Number(c.float_score)||0)*1000)/10;
  const attrs=c.attributes||{};
  function onMove(e){
    const el=tiltRef.current; if(!el) return;

    el.style.transform="rotateY("+(px*14).toFixed(2)+"deg) rotateX("+(-py*14).toFixed(2)+"deg)";

// ===================== AUTH =====================
function Auth({ lang, setLang, onBack }) {
  const t=k=>tr(lang,k);
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState(""); const [password,setPassword]=useState("");
  const [username,setUsername]=useState(""); const [password2,setPassword2]=useState(""); const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(""); const [msg,setMsg]=useState("");
  async function submit(){
    setErr(""); setMsg(""); setBusy(true);
    try {
      if(mode==="forgot"){
        const { error } = await db.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.origin });
        if(error) throw error;
        setMsg(lang==="en"
          ? "If this email has an account, a reset link is on its way. Open it to set a new password."
          : "Se este email tiver conta, o link de redefinição está a caminho. Abra-o para criar uma nova senha.");
      } else if(mode==="signup"){
        if(password !== password2){ setErr(lang==="en"?"The passwords do not match.":"As senhas não conferem."); setBusy(false); return; }
        const { data, error } = await db.auth.signUp({ email, password, options:{ data:{ username }, emailRedirectTo: window.location.origin } });
        if(error) throw error;
        if(!data.session) setMsg(t("account_created"));
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if(error) throw error;
      }
    } catch(e){ setErr(e.message||String(e)); } finally { setBusy(false); }
  }
  return (
    <div className="auth">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        {onBack ? <a href="#" className="small" style={{color:"var(--accent)"}} onClick={e=>{e.preventDefault();onBack();}}>{lang==="en"?"‹ Back":"‹ Voltar"}</a> : <span />}
        <LangToggle lang={lang} setLang={setLang} />
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,marginBottom:6}}>
        <WildLensMark size={56} idp="auth" />
        <WildLensWordmark size={40} />
        <div className="muted small">{MOTTO}</div>
      </div>
      <p className="muted small" style={{textAlign:"center"}}>{t("tagline")}</p>
      {mode==="signup" && (
        <div className="field"><label>{t("player_name")}</label>
          <input value={username} onChange={e=>setUsername(e.target.value)} placeholder="ex: naturalista_01" /></div>
      )}
      <div className="field"><label>{t("email")}</label>
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} /></div>
      {mode!=="forgot" && (
        <div className="field"><label>{t("password")}</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} /></div>
      )}
      {mode==="signup" && (
        <div className="field"><label>{lang==="en"?"Confirm password":"Confirme sua senha"}</label>
          <input type="password" value={password2} onChange={e=>setPassword2(e.target.value)} /></div>
      )}
      <button onClick={submit} disabled={busy} style={{width:"100%"}}>{busy?t("wait"):(mode==="login"?t("signin"):(mode==="signup"?t("create_account"):(lang==="en"?"Send reset link":"Enviar link de redefinição")))}</button>
      {err && <div className="err">{err}</div>}{msg && <div className="ok">{msg}</div>}
      <div style={{marginTop:16,textAlign:"center"}} className="small muted">
        {mode==="forgot" ? (
          <a href="#" style={{color:"var(--accent)"}} onClick={e=>{e.preventDefault();setErr("");setMsg("");setMode("login");}}>
            {lang==="en"?"Back to sign in":"Voltar ao login"}</a>
        ) : (
          <span>
            {mode==="login"?t("no_account"):t("have_account")}
            <a href="#" style={{color:"var(--accent)"}} onClick={e=>{e.preventDefault();setErr("");setMsg("");setMode(mode==="login"?"signup":"login");}}>
              {mode==="login"?t("signup_link"):t("signin_link")}</a>
          </span>
        )}
        {mode==="login" && (
          <div style={{marginTop:8}}>
            <a href="#" style={{color:"var(--accent)"}} onClick={e=>{e.preventDefault();setErr("");setMsg("");setMode("forgot");}}>
              {lang==="en"?"Forgot your password?":"Esqueceu a senha?"}</a>
          </div>
        )}
      </div>
    </div>
  );
}

// ===================== ABERTURA DE PACOTE (animada) =====================
function PackReveal({ cards, onClose, onOpenAnother, coins, openingAnother, err, extraPrice=100, lang }){
  const en = lang==="en";
  const [idx,setIdx]=React.useState(0);
  const [flipped,setFlipped]=React.useState({});
  const startX=React.useRef(null);
  const swiped=React.useRef(false);
  React.useEffect(()=>{ setIdx(0); setFlipped({}); },[cards]);
  const n=cards.length;
  const allRevealed = n>0 && cards.every((c,i)=>flipped[i]);
  const curFlipped = !!flipped[idx];
  function flip(i){ setFlipped(f=> f[i]?f:{...f,[i]:true}); }
  function go(d){ setIdx(i=> Math.max(0, Math.min(n-1, i+d))); }
  function flipAll(){ const o={}; cards.forEach((c,i)=>{o[i]=true;}); setFlipped(o); }
  function tapCard(){
    if(swiped.current){ swiped.current=false; return; }
    if(!curFlipped) flip(idx); else if(idx<n-1) go(1);
  }
  function tStart(e){ startX.current=e.touches[0].clientX; }
  function tEnd(e){
    if(startX.current==null) return;
    const dx=e.changedTouches[0].clientX-startX.current; startX.current=null;
    if(Math.abs(dx)>40){ swiped.current=true; go(dx<0?1:-1); }
  }
  const c=cards[idx]||{}; const r=rarityOf(c.rarity_tier);
  const hint = !curFlipped ? (en?"Tap the card to reveal":"Toque na carta para revelar")
             : (idx<n-1 ? (en?"Drag sideways or tap for the next one":"Arraste para o lado ou toque para a próxima")
                        : (allRevealed ? "" : (en?"Go back and reveal the remaining cards":"Volte e revele as cartas que faltam")));
  return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:400}}>
        <div className="panel" style={{marginBottom:0,textAlign:"center"}}>
          <div className="section-title" style={{marginTop:0}}>{allRevealed?(en?"Your cards":"Suas cartas"):(en?"Opening the pack":"Abrindo o pacote")}</div>
          <div className="muted small" style={{marginBottom:10}}>{idx+1} {en?"of":"de"} {n}</div>
          <div className="preveal-stage" onTouchStart={tStart} onTouchEnd={tEnd}>
            <div className="preveal-card" key={idx} style={{"--rglow": r.color}} onClick={tapCard}>
              <div className={"pflip"+(curFlipped?" flipped":"")}>
                <div className="pface front"><div className="packback"><WildLensMark size={58} idp={"pk"+idx} /><div className="packback-wm">wildlens</div></div></div>
                <div className="pface back"><CardFace c={c} lang={lang} /></div>
              </div>
            </div>
          </div>
          <div className="muted small" style={{marginTop:10,minHeight:18}}>{hint}</div>
          <div className="preveal-nav">
            <button className="preveal-arrow" disabled={idx===0} onClick={()=>go(-1)}>‹</button>
            <div className="preveal-dots">
              {cards.map((cc,i)=>(
                <span key={i} className={"preveal-dot"+(flipped[i]?" on":"")+(i===idx?" cur":"")}
                      style={flipped[i]?{background:rarityOf(cc.rarity_tier).color}:undefined}></span>
              ))}
            </div>
            <button className={"preveal-arrow"+((curFlipped&&idx<n-1)?" pulse":"")} disabled={idx===n-1} onClick={()=>go(1)}>›</button>
          </div>
          {!allRevealed && <button className="ghost" style={{marginTop:12}} onClick={flipAll}>{en?"Reveal all":"Revelar todas"}</button>}
          {allRevealed && (
            <React.Fragment>
              <div style={{display:"flex",gap:8,marginTop:14}}>
                <button className="ghost" style={{flex:1}} onClick={onClose}>{en?"Back":"Voltar"}</button>
                <button style={{flex:1}} disabled={openingAnother || coins<extraPrice} onClick={onOpenAnother}>{openingAnother?(en?"Opening...":"Abrindo..."):((en?"Open another (":"Abrir outro (")+extraPrice+")")}</button>
              </div>
              {coins<extraPrice && <div className="muted small" style={{marginTop:8}}>{en?"You need "+extraPrice+" coins to open another pack.":"Você precisa de "+extraPrice+" moedas para abrir outro pacote."}</div>}
              {err && <div className="err" style={{marginTop:8}}>{err}</div>}
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

              const base = l.current ? l.current.target : 0;
              const span = l.next.target - base;
              pctv = span>0 ? Math.min(100, Math.round(((l.metric-base)/span)*100)) : 0;
              const falta = Math.max(0, l.next.target - l.metric);
              if(en){
                sub = "Next: "+insTierLabel(l.next.tier,en)+" · "+falta+(l.unit?" "+l.unit:"")+" to go";
              } else {
                const verbo = falta===1 ? "falta" : "faltam";
                let u;
                if(l.unit==="%") u="%";
                else if(!l.unit) u="";
                else if(falta===1) u=" "+(l.unit==="pontos"?"ponto":(l.unit==="espécies"?"espécie":l.unit));
                else u=" "+l.unit;
                sub = "Próximo: "+insTierLabel(l.next.tier,en)+" · "+verbo+" "+falta+u;
              }
            } else {
              pctv = 100; sub = en?"Maximum level reached":"Nível máximo alcançado";
            }
            return (
              <div key={l.key} style={{display:"flex",gap:12,alignItems:"center",padding:"10px 0",borderTop: idx? "1px solid var(--line)":"none"}}>
                <InsigniaEmblem icon={l.icon} tier={emTier} unlocked={!!l.current} size={56} />
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700}}>{l.name}{lvl? <span style={{color:T.c}}> · {lvl}</span> : null}</div>
                  <div className="muted small">{sub}</div>
                  <div className="pbar" style={{marginTop:4}}><span style={{width:pctv+"%",background:T.c}}></span></div>
                </div>
              </div>
            );
          })}
      </div>
    </div>
  );
}

function MyProfileHeader({ session, profile, onNavigate, onProfileChanged, lang }){
  const [data,setData]=useState(null);
  const [charOpen,setCharOpen]=useState(false);
  const [insOpen,setInsOpen]=useState(false);
  const [pubView,setPubView]=useState(null);
  const uname = profile && profile.username;
  useEffect(()=>{ if(!uname){ setData(null); return; } let alive=true;
    (async()=>{ try{ const { data:d, error }=await db.rpc("app_public_profile",{ p_username:uname }); if(error) throw error; if(alive) setData(d&&d.ok?d:null);}catch(e){ if(alive) setData(null);} })();
    return ()=>{ alive=false; };
  },[uname]);
  if(!uname) return null;
  const en = lang==="en";
  const cb = data || {
    username: uname,
    character: (profile && profile.character) || null,
    account_level: (profile && profile.account_level) || 1,
    distinct_species: null, total_species: null,
    insignias: [], seals: []
  };
  return (
    <div className="panel cracha">
      <CrachaBody data={cb} pending={!data} onAvatarClick={()=>setCharOpen(true)} lang={lang} />
      <div className="crh-controls">
        <CardsPublicToggle session={session} lang={lang} />
        <div className="crh-actions">
          <button className="ghost small" onClick={()=>setCharOpen(true)}>{en?"Customize":"Personalizar"}</button>
          <button className="ghost small" onClick={()=>onNavigate("conta")}>{en?"Edit account":"Editar conta"}</button>
          <button className="ghost small" onClick={()=>setInsOpen(true)}>{en?"Achievements":"Conquistas"}</button>
          <button className="ghost small" onClick={()=>setPubView(uname)}>{en?"View my public profile":"Ver meu perfil público"}</button>
        </div>
      </div>
      {charOpen && (
        <div className="overlay" onClick={()=>setCharOpen(false)}>
          <div className="modal" style={{maxWidth:620}} onClick={e=>e.stopPropagation()}>
            <CharacterPanel mode="avatar" coins={profile?profile.soft_currency:0} onChanged={onProfileChanged} lang={lang} />
            <button className="ghost" style={{width:"100%",marginTop:10}} onClick={()=>setCharOpen(false)}>{en?"Close":"Fechar"}</button>

        </div>

      {pubView && <PublicProfileModal username={pubView} onClose={()=>setPubView(null)} lang={lang} />}
    </div>
  );
}

function HomeTab({ session, onChanged, onNavigate, coins, profile, canBuy=true, showBuy=true, lang }) {
  const en = lang==="en";
  const [summary,setSummary]=useState(null);
  const [collection,setCollection]=useState([]);
  const [revealed,setRevealed]=useState([]);
  const [opening,setOpening]=useState(false);
  const [buying,setBuying]=useState(false);
  const [err,setErr]=useState(""); const [loading,setLoading]=useState(true);
  const [forTrade,setForTrade]=useState({});
  const [showcase,setShowcase]=useState({});
  const [burning,setBurning]=useState(false);
  const [burnMsg,setBurnMsg]=useState("");
  const [nextFree,setNextFree]=useState(null);
  const [now,setNow]=useState(Date.now());
  const [f,setF]=useState({q:"",rarity:"",biome:"",art:"",sort:"recent"});
  const [selMode,setSelMode]=useState(false);
  const [sel,setSel]=useState({});
  const [listPrice,setListPrice]=useState("");
  const [confirmBurn,setConfirmBurn]=useState(false);
  const [busyBatch,setBusyBatch]=useState(false);
  const [extraPrice,setExtraPrice]=useState(100);
  async function load(){
    const [{ data:sum }, { data:coll }, { data:ci }] = await Promise.all([
      db.rpc("app_my_summary"),
      db.from("v_card_full").select("*").order("minted_at",{ascending:false}),
      db.from("card_instances").select("id, for_trade, showcase"),
    ]);
    setSummary(sum&&sum[0]?sum[0]:null); setCollection(coll||[]);
    const ft={}; (ci||[]).forEach(x=>ft[x.id]=x.for_trade); setForTrade(ft);
    const sc={}; (ci||[]).forEach(x=>sc[x.id]=x.showcase); setShowcase(sc);
    setLoading(false);
  }
  async function loadNext(){ try{ const {data}=await db.rpc("app_next_free_pack"); setNextFree(data? new Date(data).getTime() : 0); }catch(e){ setNextFree(0); } }
  async function loadExtra(){ try{ const {data}=await db.rpc("app_extra_pack_price"); if(data!=null) setExtraPrice(data); }catch(e){} }
  useEffect(()=>{ load(); loadNext(); loadExtra(); const t=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(t); },[]);
  async function openPack(){
    setErr(""); setOpening(true); setRevealed([]); setBurnMsg("");
    try {
      const { data:ids, error } = await db.rpc("app_open_pack");
      if(error) throw error;
      const { data:cards } = await db.from("v_card_full").select("*").in("card_id", ids);
      setRevealed(cards||[]); await load(); onChanged(); loadNext();
    } catch(e){ setErr(e.message||String(e)); } finally { setOpening(false); }
  }
  async function buyPack(){
    setErr(""); setBuying(true); setRevealed([]); setBurnMsg("");
    try {
      const { data:ids, error } = await db.rpc("app_buy_pack");
      if(error) throw error;
      const { data:cards } = await db.from("v_card_full").select("*").in("card_id", ids);
      setRevealed(cards||[]); await load(); onChanged(); loadExtra();
    } catch(e){ setErr(e.message||String(e)); } finally { setBuying(false); }
  }
  async function openAnotherInPopup(){
    setErr(""); setBuying(true); setBurnMsg("");
    try {
      const { data:ids, error } = await db.rpc("app_buy_pack");
      if(error) throw error;
      const { data:cards } = await db.from("v_card_full").select("*").in("card_id", ids);
      setRevealed(cards||[]); await load(); onChanged(); loadNext(); loadExtra();
    } catch(e){ setErr(e.message||String(e)); } finally { setBuying(false); }
  }
  async function release(cardId){
    setErr(""); setBurning(true); setRevealed([]); setBurnMsg("");
    try {
      const { data:amt, error } = await db.rpc("app_burn_card",{ p_card:cardId });
      if(error) throw error;
      setBurnMsg(en?("You returned the card and received "+amt+" coins."):("Você devolveu a carta e recebeu "+amt+" moedas.")); await load(); onChanged(); return true;
    } catch(e){ setErr(e.message||String(e)); return false; } finally { setBurning(false); }
  }
  async function toggleTrade(cardId,next){
    setErr("");
    try { const { error } = await db.rpc("app_set_for_trade",{ p_card:cardId, p_on:next }); if(error) throw error;
      setForTrade(s=>({...s,[cardId]:next})); } catch(e){ setErr(e.message||String(e)); }
  }
  async function toggleShowcase(cardId,next){
    const { error } = await db.rpc("app_set_showcase",{ p_card:cardId, p_on:next });
    if(error) throw new Error(error.message||(en?"Error showcasing":"Erro ao destacar"));
    setShowcase(s=>({...s,[cardId]:next}));
  }
  async function pasteCard(cardId){
    setErr(""); setBurnMsg("");
    try {
      const { data, error } = await db.rpc("app_paste_card",{ p_card:cardId });
      if(error) throw error;
      if(data && data.ok){ setBurnMsg(en?"Card pasted into the album.":"Carta colada no álbum."); await load(); onChanged(); }
      return data;
    } catch(e){ setErr(e.message||String(e)); return { ok:false, error:"erro" }; }
  }
  const selIds = () => Object.keys(sel).filter(k=>sel[k]);
  const selCount = selIds().length;
  function toggleSel(id){ setSel(s=>({...s,[id]:!s[id]})); }
  function exitSel(){ setSelMode(false); setSel({}); setConfirmBurn(false); setListPrice(""); }
  async function batchTrade(on){
    setErr(""); setBurnMsg(""); setBusyBatch(true);
    const ids=selIds(); let n=0, fail=0;
    for(const id of ids){ try{ const {error}=await db.rpc("app_set_for_trade",{p_card:id,p_on:on}); if(error) throw error; n++; }catch(e){ fail++; } }
    setBurnMsg(en
      ? ((on?"Added to showcase: ":"Removed from showcase: ")+n+" card"+(n!==1?"s":"")+(fail?(", "+fail+" failed."):"."))
      : ((on?"Adicionadas à vitrine: ":"Removidas da vitrine: ")+n+" carta"+(n!==1?"s":"")+(fail?(", "+fail+" não deram certo."):".")));
    exitSel(); await load(); setBusyBatch(false);
  }
  async function batchList(){
    setErr(""); setBurnMsg("");
    const p=parseInt(listPrice,10);
    if(!p||p<1){ setErr(en?"Enter a valid price, 1 coin or more.":"Informe um preço válido, de 1 moeda para cima."); return; }
    setBusyBatch(true);
    const ids=selIds(); let n=0, fail=0;
    for(const id of ids){ try{ const {error}=await db.rpc("app_list_card",{p_card:id,p_price:p}); if(error) throw error; n++; }catch(e){ fail++; } }
    setBurnMsg(en
      ? ("Listed "+n+" card"+(n!==1?"s":"")+" for "+p+" coins each"+(fail?(", "+fail+" failed (maybe already listed)."):"."))
      : ("Anunciadas "+n+" carta"+(n!==1?"s":"")+" por "+p+" moedas cada"+(fail?(", "+fail+" não deram certo (talvez já anunciadas)."):".")));
    exitSel(); await load(); onChanged(); setBusyBatch(false);
  }
  async function batchRelease(){
    setErr(""); setBurnMsg(""); setBusyBatch(true);
    const ids=selIds(); let total=0, n=0, fail=0;
    for(const id of ids){ try{ const {data:amt,error}=await db.rpc("app_burn_card",{p_card:id}); if(error) throw error; total+=Number(amt)||0; n++; }catch(e){ fail++; } }
    setBurnMsg(en
      ? ("You returned "+n+" card"+(n!==1?"s":"")+" and received "+total+" coins."+(fail?(" "+fail+" could not be returned, maybe they're listed on the market."):""))
      : ("Você devolveu "+n+" carta"+(n!==1?"s":"")+" e recebeu "+total+" moedas."+(fail?(" "+fail+" não puderam ser devolvidas, talvez estejam anunciadas no mercado."):"")));
    exitSel(); await load(); onChanged(); setBusyBatch(false);
  }
  if(loading) return <p className="muted">{en?"Loading...":"Carregando..."}</p>;
  const remaining = nextFree!=null ? nextFree - now : null;
  const freeReady = remaining!=null && remaining<=0;
  return (
    <div>
      <MyProfileHeader session={session} profile={profile} onNavigate={onNavigate} onProfileChanged={onChanged} lang={lang} />
      <div className="panel">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <div><div style={{fontWeight:700,fontSize:16}}>{en?"Packs":"Pacotes"}</div>
            <div className="muted small">{en?"Basic: 5 free cards every 3 days. Extra: 5 cards for 150 coins.":"Básico: 5 cartas grátis a cada 3 dias. Extra: 5 cartas por 150 moedas."}</div>
            {!freeReady && remaining!=null ? <div className="small" style={{color:"var(--accent)",marginTop:4}}>{en?"Next free pack in ":"Próximo pacote grátis em "}{fmtRemaining(remaining)}</div> : null}</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={openPack} disabled={opening || !freeReady}>{opening?(en?"Opening...":"Abrindo..."):(freeReady?(en?"Open free":"Abrir grátis"):(remaining==null?(en?"Checking...":"Verificando..."):(en?"On cooldown":"Em espera")))}</button>
            {!showBuy ? null
              : canBuy
                ? <button className="ghost" onClick={buyPack} disabled={buying || (coins||0)<extraPrice}>{buying?(en?"Buying...":"Comprando..."):((en?"Buy extra (":"Comprar extra (")+extraPrice+")")}</button>
                : <span className="muted small">{en?"Buying packs requires your guardian's authorization.":"A compra de pacotes precisa da autorização do responsável."}</span>}
          </div>
        </div>
        {err && <div className="err">{err}</div>}
      </div>
      {revealed.length>0 && (
        <PackReveal cards={revealed} onClose={()=>setRevealed([])} onOpenAnother={openAnotherInPopup} coins={coins||0} openingAnother={buying} err={err} extraPrice={extraPrice} lang={lang} />
      )}
      {burnMsg && (
        <div className="panel"><div className="ok">{burnMsg}</div></div>
      )}
      <div className="panel">
        <div className="section-title">{en?"My collection":"Minha coleção"}{summary?(en?(" - "+summary.total_cards+" cards, "+summary.distinct_species+" of "+summary.total_species+" species"):(" - "+summary.total_cards+" cartas, "+summary.distinct_species+" de "+summary.total_species+" espécies")):""}</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",marginBottom:10}}>
          {["comum","incomum","rara","lendaria","lendaria_reversa"].map(k=>(
            <span key={k} style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:12}}>
              <span style={{width:9,height:9,borderRadius:9,background:RARITY[k].color,display:"inline-block"}}></span>{rarityLabel(k,en)}
            </span>
          ))}
          {onNavigate && <span onClick={()=>onNavigate("sobre")} className="muted small" style={{cursor:"pointer",textDecoration:"underline"}}>{en?"see odds":"ver chances"}</span>}
        </div>
        {collection.length===0 ? <p className="muted">{en?"Your collection is empty. Open a pack to get started.":"Sua coleção está vazia. Abra um pacote para começar."}</p>
          : <React.Fragment>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:10}}>
                <button className={selMode?"":"ghost"} style={{padding:"6px 12px",fontSize:13}} onClick={()=>{ if(selMode) exitSel(); else setSelMode(true); }}>
                  {selMode?(en?"Exit selection":"Sair da seleção"):(en?"Select several":"Selecionar várias")}</button>
                {selMode && <span className="muted small">{en?"Tap cards to mark them":"Toque nas cartas para marcar"}</span>}
              </div>
              {selMode && (
                <div className="panel" style={{borderColor:"var(--accent)",marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <span style={{fontWeight:700}}>{selCount} {en?(selCount!==1?"selected":"selected"):("selecionada"+(selCount!==1?"s":""))}</span>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      <button className="ghost" style={{padding:"5px 10px",fontSize:12}} onClick={()=>{ const all={}; filterCards(collection,f).forEach(c=>all[c.card_id]=true); setSel(all); }}>{en?"Mark all":"Marcar todas"}</button>
                      <button className="ghost" style={{padding:"5px 10px",fontSize:12}} onClick={()=>setSel({})}>{en?"Clear":"Limpar"}</button>
                    </div>
                  </div>
                  {selCount>0 && <React.Fragment>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
                      {false && (<React.Fragment>
                      <button className="ghost" disabled={busyBatch} onClick={()=>batchTrade(true)}>{en?"Add to showcase":"Adicionar à vitrine"}</button>
                      <button className="ghost" disabled={busyBatch} onClick={()=>batchTrade(false)}>{en?"Remove from showcase":"Remover da vitrine"}</button>
                      </React.Fragment>)}
                      <button className="ghost" disabled={busyBatch} onClick={()=>setConfirmBurn(true)}>{en?"Return (":"Devolver ("}{selCount})</button>
                    </div>
                    <div style={{display:"flex",gap:8,alignItems:"flex-end",flexWrap:"wrap",marginTop:10}}>
                      <div><label className="muted small">{en?"Price per card on the market":"Preço por carta no mercado"}</label>
                        <input type="number" min="1" value={listPrice} onChange={e=>setListPrice(e.target.value)} placeholder={en?"coins":"moedas"} style={{maxWidth:160}} /></div>
                      <button disabled={busyBatch} onClick={batchList}>{en?"List (":"Anunciar ("}{selCount})</button>
                    </div>
                    {confirmBurn && <div style={{marginTop:10}}>
                      <div className="small" style={{color:"#ff7b72",marginBottom:8}}>{en?("Return "+selCount+" card"+(selCount!==1?"s":"")+"? It leaves your collection and grants coins based on rarity. This cannot be undone."):("Devolver "+selCount+" carta"+(selCount!==1?"s":"")+"? Sai da sua coleção e concede moedas conforme a raridade. Não dá para desfazer.")}</div>
                      <button disabled={busyBatch} onClick={batchRelease}>{en?"Confirm return":"Confirmar devolução"}</button>
                      <button className="ghost" style={{marginLeft:8}} onClick={()=>setConfirmBurn(false)}>{en?"Cancel":"Cancelar"}</button>
                    </div>}
                  </React.Fragment>}
                  {busyBatch && <div className="muted small" style={{marginTop:8}}>{en?"Processing...":"Processando..."}</div>}
                </div>
              )}
              <FilterBar f={f} setF={setF} biomes={biomeOptions(collection)} artFilter en={en}
                sortOptions={en
                  ? [["recent","Recent"],["float_desc","Higher float"],["float_asc","Lower float"],["name","Name"],["mass_desc","Highest mass"],["mass_asc","Lowest mass"],["length_desc","Longest"],["length_asc","Shortest"],["lifespan_desc","Longest-lived"],["lifespan_asc","Shortest-lived"]]
                  : [["recent","Recentes"],["float_desc","Float maior"],["float_asc","Float menor"],["name","Nome"],["mass_desc","Maior massa"],["mass_asc","Menor massa"],["length_desc","Maior comprimento"],["length_asc","Menor comprimento"],["lifespan_desc","Maior longevidade"],["lifespan_asc","Menor longevidade"]]} />
              <BackToTop lang={lang} />
              {filterCards(collection,f).length===0
                ? <p className="muted">{en?"No cards match these filters.":"Nenhuma carta com esses filtros."}</p>
                : selMode
                  ? <div className="grid">{filterCards(collection,f).map(c=>(
                      <div key={c.card_id} className={"selcard"+(sel[c.card_id]?" on":"")} onClick={()=>toggleSel(c.card_id)}>
                        <CardFace c={c} lang={lang} />
                        <div className="selmark">✓</div>
                      </div>
                    ))}</div>
                  : <div className="grid">{filterCards(collection,f).map(c=>(
                      <Card key={c.card_id} c={c} manage forTrade={!!forTrade[c.card_id]} onRelease={release} onToggleTrade={toggleTrade} onPaste={pasteCard} onNavigate={onNavigate} showcase={!!showcase[c.card_id]} onToggleShowcase={toggleShowcase} lang={lang} />
                    ))}</div>}
            </React.Fragment>}
      </div>
    </div>
  );
}

// ===================== ABA ESPECIES (progresso) =====================
function SpeciesTab({ lang }) {
  const en = lang==="en";
  const [cat,setCat]=useState(null);
  const [prog,setProg]=useState({});
  const [byBiome,setByBiome]=useState({});
  const [open,setOpen]=useState(null);
  const [q,setQ]=useState(""); const [fb,setFb]=useState(""); const [fs,setFs]=useState("");
  useEffect(()=>{ (async()=>{
    const [{data:c},{data:p},{data:cards}]=await Promise.all([
      db.from("v_species_catalog").select("*").order("common_name"),
      db.rpc("app_my_progress"),
      db.from("v_card_full").select("species_id,primary_biome"),
    ]);
    setCat(c||[]);
    const m={}; (p||[]).forEach(x=> m[x.species_id]=x); setProg(m);
    const bb={}; (cards||[]).forEach(x=>{ const k=x.species_id+"|"+x.primary_biome; bb[k]=(bb[k]||0)+1; }); setByBiome(bb);
    try{ const f=window.__focusSpecies; if(f){ const sp=(c||[]).find(x=>x.common_name===f); if(sp) setOpen(sp.species_id); window.__focusSpecies=null; } }catch(e){}
  })(); },[]);
  if(cat===null) return <p className="muted">{en?"Loading...":"Carregando..."}</p>;
  const norm = x => (x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const biomeSet = new Set();
  cat.forEach(s=>{ const bs=(s.biomes&&s.biomes.length)?s.biomes:(s.primary_biome?[s.primary_biome]:[]); bs.forEach(b=>biomeSet.add(b)); });
  const biomeOpts = Array.from(biomeSet).sort();
  const selSt = {padding:"9px 10px",borderRadius:8,border:"1px solid var(--line)",background:"#e7dcc4",color:"var(--text)",fontSize:14};
  const filtered = cat.filter(s=>{
    const bs=(s.biomes&&s.biomes.length)?s.biomes:(s.primary_biome?[s.primary_biome]:[]);
    if(q){ const nq=norm(q); if(!(norm(s.common_name).includes(nq) || norm(s.scientific_name).includes(nq))) return false; }
    if(fb && !bs.includes(fb)) return false;
    if(fs){
      const pr=prog[s.species_id]; const owned=pr?Number(pr.owned_count):0; const complete=pr&&pr.all_rarities;
      if(fs==="tenho" && owned<=0) return false;
      if(fs==="faltam" && owned>0) return false;
      if(fs==="completas" && !complete) return false;
    }
    return true;
  });
  return (
    <div className="panel enc">
      <div className="section-title">{en?"Species encyclopedia":"Enciclopédia das espécies"}</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder={en?"Search by name":"Buscar por nome"} style={{flex:"1 1 150px",margin:0}} />
        <select value={fb} onChange={e=>setFb(e.target.value)} style={selSt}>
          <option value="">{en?"All biomes":"Todos os biomas"}</option>
          {biomeOpts.map(b=> <option key={b} value={b}>{biomeStyle(b).s}</option>)}
        </select>
        <select value={fs} onChange={e=>setFs(e.target.value)} style={selSt}>
          <option value="">{en?"All species":"Todas as espécies"}</option>
          <option value="tenho">{en?"That I have":"Que eu tenho"}</option>
          <option value="faltam">{en?"That I'm missing":"Que faltam"}</option>
          <option value="completas">{en?"Complete":"Completas"}</option>
        </select>
      </div>
      <div className="muted small" style={{marginBottom:8}}>{filtered.length} {en?"of":"de"} {cat.length} {en?"species":"espécies"}</div>
      {filtered.length===0 ? <p className="muted small">{en?"No species match these filters.":"Nenhuma espécie com esses filtros."}</p> : filtered.map(s=>{
        const pr = prog[s.species_id];
        const owned = pr ? Number(pr.owned_count) : 0;
        const complete = pr && pr.all_rarities;
        const biomes = (s.biomes && s.biomes.length) ? s.biomes : (s.primary_biome ? [s.primary_biome] : []);
        const isOpen = open===s.species_id;

// ===================== ABA QUIZ =====================
function QuizTab({ onChanged, lang }) {
  const en = lang==="en";
  const [phase,setPhase]=useState("idle"); // idle | loading | play | done
  const [questions,setQuestions]=useState([]);
  const [idx,setIdx]=useState(0);
  const [remaining,setRemaining]=useState(0);
  const [timeUp,setTimeUp]=useState(false);
  const [answered,setAnswered]=useState(null); // {correct, optionId}
  const [skipped,setSkipped]=useState(0);
  const [result,setResult]=useState(null);
  const [err,setErr]=useState("");
  const [status,setStatus]=useState(null);
  const [qnow,setQnow]=useState(Date.now());
  const [kstat,setKstat]=useState(null);
  const sidRef=useRef(null); const startRef=useRef(0); const answeredRef=useRef(false);
  async function loadStatus(){ try{ const {data}=await db.rpc("app_quiz_status"); setStatus(data&&data[0]?data[0]:null); }catch(e){} }
  async function loadKnowledge(){ try{ const {data}=await db.rpc("app_knowledge_status"); setKstat(data||null); }catch(e){} }
  useEffect(()=>{ loadStatus(); loadKnowledge(); const t=setInterval(()=>setQnow(Date.now()),1000); return ()=>clearInterval(t); },[]);

  async function start(){
    setErr(""); setPhase("loading"); setResult(null);
    try {
      const { data:sid, error } = await db.rpc("app_start_quiz",{ p_num_questions:5 });
      if(error) throw error;
      sidRef.current=sid;
      const { data:qs, error:e2 } = await db.rpc("app_get_session_questions",{ p_session:sid });
      if(e2) throw e2;
      setQuestions(qs||[]); setIdx(0); setSkipped(0); setPhase("play");
    } catch(e){ setErr(e.message||String(e)); setPhase("idle"); }
  }

  // timer por pergunta: limite de ate 15s
  useEffect(()=>{
    if(phase!=="play" || !questions[idx]) return;
    setAnswered(null); setTimeUp(false); answeredRef.current=false;
    const limit=Math.min(questions[idx].time_limit_seconds || 15, 15);
    setRemaining(limit); startRef.current=Date.now();
    const tick=setInterval(()=>{
      if(answeredRef.current){ clearInterval(tick); return; }
      setRemaining(r=>{
        if(r<=1){ clearInterval(tick); setTimeUp(true); return 0; }
        return r-1;
      });
    },1000);
    return ()=> clearInterval(tick);
  },[idx,phase]);

  // tempo esgotado sem resposta: pula a pergunta e segue, sem registrar resposta
  useEffect(()=>{
    if(phase!=="play") return;
    if(timeUp && !answered){
      setSkipped(s=>s+1);
      const to=setTimeout(()=> next(), 1300);
      return ()=> clearTimeout(to);
    }
  },[timeUp]);

  async function choose(optId){
    if(answered || timeUp) return;
    answeredRef.current=true;
    const q=questions[idx];
    const t=(Date.now()-startRef.current)/1000;
    let correct=false, correctId=null;
    try { const { data }=await db.rpc("app_answer_quiz",{ p_session:sidRef.current, p_question:q.question_id, p_option:optId, p_time:t }); correct=!!(data&&data.correct); correctId=data?data.correct_option_id:null; } catch(e){}
    setAnswered({ correct, optionId:optId, correctId });
  }
  async function finish(){
    try { const { data }=await db.rpc("app_finish_quiz",{ p_session:sidRef.current }); setResult(data&&data[0]?data[0]:null); } catch(e){ setErr(e.message||String(e)); }
    setPhase("done"); onChanged(); loadStatus(); loadKnowledge();
  }
  function next(){ if(idx+1<questions.length) setIdx(idx+1); else finish(); }

  const kbadge = kstat ? (function(){
    const t = TIER[kstat.tier] || TIER.iniciante;
    const allowed = (kstat.allowed||[]).map(d=> diffLabel(d,en)).join(", ");
    const floor = kstat.floor||0, nextAtVal = kstat.next_at;
    const pct = nextAtVal!=null ? Math.max(0, Math.min(100, Math.round(((kstat.rank-floor)/(nextAtVal-floor))*100))) : 100;
    return (
      <div style={{border:"1px solid "+t.c+"55",background:t.c+"12",borderRadius:10,padding:"10px 12px",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span className="diffseal" style={{background:t.c+"22",color:t.c,borderColor:t.c}}>{tierLabel(kstat.tier,en)}</span>
          <b>{kstat.rank}</b><span className="muted small">{en?"ranking points":"pts de ranqueamento"}</span>
        </div>
        <div className="pbar" style={{marginTop:8}}><span style={{width:pct+"%",background:t.c}}></span></div>
        <p className="small muted" style={{marginTop:6,marginBottom:0}}>
          {nextAtVal!=null ? (en?("Missing "+(nextAtVal-kstat.rank)+" for the next tier. "):("Faltam "+(nextAtVal-kstat.rank)+" para a próxima faixa. ")) : (en?"You've reached the top tier. ":"Você chegou à faixa máxima. ")}
          {en?"Questions at your level: ":"Perguntas no seu nível: "}{allowed}.
        </p>
      </div>
    );
  })() : null;

  if(phase==="idle"){
    const nextAt = status&&status.next_at? new Date(status.next_at).getTime() : 0;
    const cooldownLeft = nextAt - qnow;
    const atLimit = status && status.plays >= status.max_plays && cooldownLeft > 0;
    return (
      <div className="panel">
        {kbadge}
        <div className="section-title">{en?"Fauna quiz":"Quiz da fauna"}</div>
        <p className="muted">{en?"Answer questions about the animals and earn coins and knowledge points. Each question is timed.":"Responda perguntas sobre os animais e ganhe moeda e pontos de conhecimento. Cada pergunta tem tempo."}</p>
        {status ? <p className="small muted">{en?("You've started "+status.plays+" of "+status.max_plays+" quizzes today."):("Você iniciou "+status.plays+" de "+status.max_plays+" quizzes hoje.")}</p> : null}
        {atLimit ? <p className="small" style={{color:"var(--accent)"}}>{en?"Next quiz available in ":"Próximo quiz disponível em "}{fmtRemaining(cooldownLeft)}</p> : null}
        <button onClick={start} disabled={atLimit}>{en?"Start quiz":"Iniciar quiz"}</button>
        {err && <div className="err">{err}</div>}
      </div>
    );
  }
  if(phase==="loading") return <p className="muted">{en?"Preparing questions...":"Preparando perguntas..."}</p>;
  if(phase==="done"){
    const nextAt = status&&status.next_at? new Date(status.next_at).getTime() : 0;
    const cooldownLeft = nextAt - qnow;
    const atLimit = status && status.plays >= status.max_plays && cooldownLeft > 0;
    return (
    <div className="panel">
      {kbadge}
      <div className="section-title">{en?"Result":"Resultado"}</div>
      {result ? (
        <div>
          <p style={{fontSize:18}}>{en?"You got ":"Você acertou "}<b>{result.correct_count}</b>{en?" of ":" de "}<b>{result.total_questions}</b>{en?" right.":"."}</p>
          <p className="ok">{en?("You earned "+result.reward_currency+" coins and "+result.education_points_gained+" knowledge points."):("Ganhou "+result.reward_currency+" de moeda e "+result.education_points_gained+" pontos de conhecimento.")}</p>
          {skipped>0 && <p className="small muted">{en?(skipped===1?"1 question was skipped for time and didn't score.":skipped+" questions were skipped for time and didn't score."):(skipped===1?"1 pergunta foi pulada por tempo e não pontuou.":skipped+" perguntas foram puladas por tempo e não pontuaram.")}</p>}
        </div>
      ) : <p className="muted">{en?"Quiz finished.":"Quiz finalizado."}</p>}
      {status ? <p className="small muted" style={{marginTop:8}}>{en?("You've started "+status.plays+" of "+status.max_plays+" quizzes today."):("Você iniciou "+status.plays+" de "+status.max_plays+" quizzes hoje.")}</p> : null}
      {atLimit
        ? <p className="small" style={{color:"var(--accent)"}}>{en?"Next quiz available in ":"Próximo quiz disponível em "}{fmtRemaining(cooldownLeft)}</p>
        : <button onClick={start} style={{marginTop:8}}>{en?"Play again":"Jogar de novo"}</button>}
    </div>
    );
  }

  // phase play
  const q=questions[idx];
  return (
    <div className="panel">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8}}>
        <span className="muted small">{en?"Question ":"Pergunta "}{idx+1}{en?" of ":" de "}{questions.length}{q.species?" | "+q.species:""}</span>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {q.difficulty && DIFF[q.difficulty] && <span className="diffseal" style={{background:DIFF[q.difficulty].c+"22",color:DIFF[q.difficulty].c,borderColor:DIFF[q.difficulty].c}}>{diffLabel(q.difficulty,en)}</span>}
          <span className="timer" style={{color: remaining<=5 ? "#ff7b72" : "var(--text)"}}>{timeUp?(en?"Time!":"Tempo!"):remaining+"s"}</span>
        </div>
      </div>
      <p style={{fontSize:17,fontWeight:600,marginTop:0}}>{q.question_text}</p>
      {(q.options||[]).map(o=>{
        let cls="opt";
        if(answered){
          if(answered.correctId && o.option_id===answered.correctId) cls+=" correct";
          else if(answered.optionId===o.option_id) cls+=" wrong";
        }
        return <button key={o.option_id} className={cls} disabled={!!answered||timeUp} onClick={()=>choose(o.option_id)}>{o.option_text}</button>;
      })}
      {answered && <div className={answered.correct?"ok":"err"}>{answered.correct?(en?"Correct!":"Correto!"):(en?"Wrong answer. The correct one is in green.":"Resposta incorreta. A correta está em verde.")}</div>}
      {timeUp && !answered && <div className="err">{en?"Time's up. Skipping to the next one...":"Tempo esgotado. Pulando para a próxima..."}</div>}
      {answered && <button onClick={next} style={{marginTop:8}}>{idx+1<questions.length?(en?"Next":"Próxima"):(en?"See result":"Ver resultado")}</button>}
    </div>
  );
}

// ===================== ABA CONQUISTAS =====================
function AchievementsTab({ onClaimed, lang }) {
  const en = lang==="en";
  const [list,setList]=useState(null);
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState("");
  async function load(){
    const [{ data:ach }, { data:ua }] = await Promise.all([
      db.from("achievements").select("id, category, title, description, target_value, reward_currency, reward_pack_id, reward_avatar_key"),
      db.from("user_achievements").select("achievement_id, progress, unlocked_at, claimed_at"),
    ]);
    const map={}; (ua||[]).forEach(u=> map[u.achievement_id]=u);
    setList((ach||[]).map(a=>({ ...a,
      prog: map[a.id]?map[a.id].progress:0,
      unlocked: !!(map[a.id]&&map[a.id].unlocked_at),
      claimed: !!(map[a.id]&&map[a.id].claimed_at) })));
  }
  useEffect(()=>{ load(); },[]);
  function hasReward(a){ return a.reward_currency>0 || a.reward_pack_id || a.reward_avatar_key; }
  async function claim(id){
    setBusy(true); setMsg("");
    try{ const { data }=await db.rpc("app_claim_achievement",{ p_achievement_id:id });
      if(data && data.ok){ await load(); if(onClaimed) onClaimed(); }
    }catch(e){} finally{ setBusy(false); }
  }
  async function claimAll(){
    setBusy(true); setMsg("");
    try{ const { data }=await db.rpc("app_claim_all_achievements");
      if(data && data.ok){ setMsg(en?("Claimed: "+(data.currency||0)+" coins across "+(data.claimed||0)+" achievement(s)."):("Resgatado: "+(data.currency||0)+" moedas em "+(data.claimed||0)+" conquista(s).")); await load(); if(onClaimed) onClaimed(); }
    }catch(e){} finally{ setBusy(false); }
  }
  if(list===null) return <p className="muted">{en?"Loading...":"Carregando..."}</p>;
  const claimable = list.filter(a=> a.unlocked && !a.claimed && hasReward(a));
  return (
    <div className="panel">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
        <div className="section-title" style={{marginBottom:0}}>{en?"Achievements":"Conquistas"}</div>
        {claimable.length>0 && <button onClick={claimAll} disabled={busy}>{en?"Claim all (":"Resgatar tudo ("}{claimable.length})</button>}
      </div>
      <p className="muted small" style={{marginTop:6}}>{en?"Unlocked achievements hold their reward until you claim it.":"Conquistas desbloqueadas guardam a recompensa até você resgatar."}</p>
      {msg && <div className="ok" style={{marginBottom:8}}>{msg}</div>}
      {list.map(a=>{
        const tgt=a.target_value; const pct=tgt? Math.min(100, Math.round((a.prog/tgt)*100)) : (a.unlocked?100:0);
        const reward = (a.reward_currency>0? a.reward_currency+(en?" coins":" moedas"):"") + (a.reward_pack_id? ((a.reward_currency>0?" + ":"")+(en?"1 pack":"1 pacote")):"");
        const canClaim = a.unlocked && !a.claimed && hasReward(a);
        return (
          <div className="ach" key={a.id}>
            <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
              <div style={{fontWeight:700}}>{a.title} {a.unlocked ? <span style={{color:"#56d364"}}>{en?"unlocked":"desbloqueada"}</span> : ""} {a.claimed ? <span className="muted small">{en?"· claimed":"· resgatada"}</span> : ""}</div>
              <div className="muted small">{tgt? a.prog+"/"+tgt : ""}</div>
            </div>
            <div className="muted small">{a.description}</div>
            {reward ? <div className="small" style={{color:"#8fe3ad",marginTop:2}}>{en?"Reward: ":"Recompensa: "}{reward}</div> : null}
            <div className="pbar"><span style={{width:pct+"%", background:a.unlocked?"#56d364":"var(--accent)"}}></span></div>
            {canClaim && <button style={{marginTop:8}} onClick={()=>claim(a.id)} disabled={busy}>{en?"Claim reward":"Resgatar recompensa"}</button>}
          </div>
        );
      })}
    </div>
  );
}

// ===================== ABA HOJE (painel diario + primeiros passos) =====================
function HojeTab({ session, profile, onNavigate, lang }){
  const en = lang==="en";
  const [summary,setSummary]=useState(null);
  const [nextFree,setNextFree]=useState(null);
  const [quiz,setQuiz]=useState(null);
  const [match,setMatch]=useState(null);
  const [team,setTeam]=useState(null);
  const [checkin,setCheckin]=useState(null);
  const [missions,setMissions]=useState(null);
  const [claimMsg,setClaimMsg]=useState("");
  const [checkinMsg,setCheckinMsg]=useState("");
  const [claimBusy,setClaimBusy]=useState(false);
  const [now,setNow]=useState(Date.now());
  async function refreshDaily(){
    try{
      const { data, error }=await db.rpc("app_checkin_status");
      setCheckin(error? {error:error.message} : (data&&data[0]?data[0]:{error: en?"no data":"sem dados"}));
    }catch(e){ setCheckin({error:e.message||String(e)}); }
    try{
      const { data, error }=await db.rpc("app_missions_status");
      setMissions(error? [] : (data||[]));
    }catch(e){ setMissions([]); }
  }
  useEffect(()=>{ (async()=>{
    const [{data:sum},{data:nf},{data:qs},{data:ms},{data:t}]=await Promise.all([
      db.rpc("app_my_summary"),
      db.rpc("app_next_free_pack"),
      db.rpc("app_quiz_status"),
      db.rpc("app_match_status"),
      db.from("ranked_teams").select("rating,wins,losses,draws").maybeSingle(),
    ]);
    setSummary(sum&&sum[0]?sum[0]:null);
    setNextFree(nf? new Date(nf).getTime() : 0);
    setQuiz(qs&&qs[0]?qs[0]:null);
    setMatch(ms&&ms[0]?ms[0]:null);
    setTeam(t||null);
    refreshDaily().catch(()=>{});
  })();
    const tm=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(tm);
  },[]);

  async function doCheckin(){
    setClaimBusy(true); setCheckinMsg("");
    try{
      const { data, error }=await db.rpc("app_checkin");
      if(error) throw error;
      const r=data&&data[0]?data[0]:null;
      setCheckinMsg(r
        ? (en ? ("Checked in. +"+r.reward+" coins, "+r.streak+"-day streak.") : ("Check-in feito. Mais "+r.reward+" de moeda, sequência de "+r.streak+" dia"+(r.streak===1?"":"s")+"."))
        : (en?"Checked in.":"Check-in feito."));
      await refreshDaily();
    }catch(e){ setCheckinMsg(e.message||String(e)); } finally { setClaimBusy(false); }
  }
  async function claimMission(key){
    setClaimBusy(true); setClaimMsg("");
    try{
      const { data, error }=await db.rpc("app_claim_mission",{ p_key:key });
      if(error) throw error;
      setClaimMsg(en ? ("Reward claimed. +"+(data!=null?data:"")+" coins.") : ("Recompensa resgatada. Mais "+(data!=null?data:"")+" de moeda."));
      await refreshDaily();
    }catch(e){ setClaimMsg(e.message||String(e)); } finally { setClaimBusy(false); }
  }
  const missionLabel = en
    ? { quiz:"Complete 1 quiz", match:"Play 1 field challenge", pack:"Open 1 pack", all:"Complete all 3 daily missions" }
    : { quiz:"Complete 1 quiz", match:"Jogue 1 desafio de campo", pack:"Abra 1 pacote", all:"Complete as 3 missões do dia" };

  const packRemaining = nextFree!=null ? nextFree-now : null;
  const packReady = packRemaining!=null && packRemaining<=0;
  const quizLeft = quiz ? Math.max(0, quiz.max_plays - quiz.plays) : null;
  const quizNextAt = quiz&&quiz.next_at? new Date(quiz.next_at).getTime() : 0;
  const quizCooldown = quizNextAt - now;
  const quizBlocked = quiz && quizLeft<=0 && quizCooldown>0;
  const isNew = summary && Number(summary.total_cards)===0;

  function Action({title,desc,cta,onClick,ready,accent}){

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid var(--line)"}}>

          <div style={{fontWeight:700}}>{title}</div>
          <div className="muted small">{desc}</div>
        </div>
        <button className={accent?"":"ghost"} onClick={onClick} disabled={!ready} style={{flexShrink:0}}>{cta}</button>
      </div>
    );
  }

  return (
    <div>
      {isNew && (
        <div className="panel" style={{borderColor:"var(--accent)"}}>
          <div className="section-title">{en?"First steps":"Primeiros passos"}</div>

const LADDER_META = [
  {key:"saber",   name:"Conhecimento",         icon:"saber",   conds:["knowledge_rank"],                       unit:"pontos"},
  {key:"colecao", name:"Coleção de espécies",  icon:"colecao", conds:["species_percent"],                      unit:"%"},
  {key:"especie", name:"Maestria de espécies", icon:"especie", conds:["species_all_rarities","completionist"], unit:"espécies"},
  {key:"bioma",   name:"Bioma",                icon:"bioma",   conds:["biome_species_any"],                    unit:"espécies"},
  {key:"arena",   name:"Arena",                icon:"arena",   conds:["ranked_rating"],                        unit:"de rating"},
  {key:"familia", name:"Família",              icon:"familia", conds:["family_complete_any"],                  unit:""},
];
const LADDER_META_EN = {
  saber:   {name:"Knowledge",          unit:"points"},
  colecao: {name:"Species collection", unit:"%"},
  especie: {name:"Species mastery",    unit:"species"},
  bioma:   {name:"Biome",              unit:"species"},
  arena:   {name:"Arena",              unit:"rating"},
  familia: {name:"Family",             unit:""},
};
const TIER_ORDER = {bronze:1,prata:2,ouro:3,diamante:4};
function buildLadders(insArray, totalSpecies, lang){
  const en = lang==="en";
  return LADDER_META.map(m=>{
    let tiers=(insArray||[]).filter(x=>m.conds.indexOf(x.condition_type)>=0).map(x=>({
      tier:x.insignia_tier, title:x.title, description:x.description, unlocked:x.unlocked,
      target: x.condition_type==="completionist" ? (totalSpecies||0) : (x.target_value||0),
      prog: x.prog||0,
    }));
    tiers.sort((a,b)=>(TIER_ORDER[a.tier]||9)-(TIER_ORDER[b.tier]||9));
    const metric = tiers.reduce((mx,t)=>Math.max(mx, t.prog||0), 0);
    let current=null; tiers.forEach(t=>{ if(t.unlocked) current=t; });
    const next = tiers.find(t=>!t.unlocked) || null;
    const i18n = en ? LADDER_META_EN[m.key] : null;
    return {key:m.key, name: i18n?i18n.name:m.name, icon:m.icon, unit: i18n?i18n.unit:m.unit, tiers, metric, current, next, single: tiers.length<=1};
  }).filter(l=>l.tiers.length>0);
}

    setCosmeticItems(chd&&chd.items ? chd.items : []);

            </div>
          </div>
        </div>
        {charOpen && (
          <div className="overlay" onClick={()=>setCharOpen(false)}>
            <div className="modal" style={{maxWidth:620}} onClick={e=>e.stopPropagation()}>
              <CharacterPanel mode="avatar" coins={profile?profile.soft_currency:0} onChanged={onProfileChanged} />
              <button className="ghost" style={{width:"100%",marginTop:10}} onClick={()=>setCharOpen(false)}>Fechar</button>
            </div>
          </div>
        )}
      </div>

      <div className="panel">
        <div className="section-title">Resumo</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <div className="stat" style={{flex:"1 1 130px"}}><span className="muted small">Espécies</span><br/><b>{summary?summary.distinct_species:0}/{summary?summary.total_species:0}</b></div>

          <div className="stat" style={{flex:"1 1 130px"}}><span className="muted small">Conquistas</span><br/><b>{ach?ach.unlocked:0}/{ach?ach.total:0}</b></div>

      </div>

        <CardsPublicToggle session={session} />
        <div style={{marginTop:10}}>

        </div>

      {ladders && ladders.length>0 && (

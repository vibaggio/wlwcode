            <div className="section-title">Insígnias</div>
            <span className="muted small" style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>onNavigate("sobre")}>Como funciona</span>
          </div>
          {ladders.map((l,idx)=>{
            const emTier = l.current ? l.current.tier : (l.next ? l.next.tier : "bronze");
            const T = INS_TIER[emTier] || INS_TIER.bronze;
            const lvl = l.current ? INS_TIER[l.current.tier].l : null;
            let pctv, sub;
            if(l.single){
              pctv = l.current ? 100 : 0;
              sub = l.current ? "Conquistada" : (l.tiers[0] ? l.tiers[0].description : "Bloqueada");
            } else if(l.next){
              const base = l.current ? l.current.target : 0;
              const span = l.next.target - base;
              pctv = span>0 ? Math.min(100, Math.round(((l.metric-base)/span)*100)) : 0;
              const falta = Math.max(0, l.next.target - l.metric);
              const verbo = falta===1 ? "falta" : "faltam";
              let u;
              if(l.unit==="%") u="%";
              else if(!l.unit) u="";
              else if(falta===1) u=" "+(l.unit==="pontos"?"ponto":(l.unit==="espécies"?"espécie":l.unit));
              else u=" "+l.unit;
              sub = "Próximo: "+INS_TIER[l.next.tier].l+" · "+verbo+" "+falta+u;
            } else {
              pctv = 100; sub = "Nível máximo alcançado";
            }
            return (
              <div key={l.key} style={{display:"flex",gap:12,alignItems:"center",padding:"10px 0",borderTop: idx? "1px solid var(--line)":"none"}}>
                <InsigniaEmblem icon={l.icon} tier={emTier} unlocked={!!l.current} size={56} />

                  <div className="pbar" style={{marginTop:4}}><span style={{width:pctv+"%",background:T.c}}></span></div>
                </div>
              </div>
            );
          })}

      {loaded && !best && <div className="panel"><p className="muted" style={{margin:0}}>Abra pacotes para começar a montar seu perfil.</p></div>}

  );
}

function MarketTab({ session, onChanged, onNavigate, canBuy=true, lang }){
  const en = lang==="en";
  const uid=session.user.id;
  const [listings,setListings]=useState(null);
  const [collection,setCollection]=useState([]);
  const [pickCard,setPickCard]=useState(""); const [price,setPrice]=useState("");
  const [err,setErr]=useState(""); const [msg,setMsg]=useState("");
  const [f,setF]=useState({q:"",rarity:"",biome:"",sort:"price_asc"});
  async function load(){
    const [{data:ls},{data:coll}]=await Promise.all([
      db.from("v_market_active").select("*").order("price_currency",{ascending:true}),
      db.from("v_card_full").select("*").order("minted_at",{ascending:false}),
    ]);
    setListings(ls||[]); setCollection(coll||[]);
  }
  useEffect(()=>{ load(); },[]);
  async function buy(id){
    setErr(""); setMsg("");
    try{ const {error}=await db.rpc("app_buy_listing",{p_listing:id}); if(error) throw error; setMsg(en?"Purchase complete.":"Compra realizada."); await load(); onChanged(); }
    catch(e){ setErr(e.message||String(e)); }
  }
  async function sell(){
    setErr(""); setMsg("");
    if(!pickCard||!price){ setErr(en?"Choose a card and a price.":"Escolha uma carta e um preço."); return; }
    try{ const {error}=await db.rpc("app_list_card",{p_card:pickCard,p_price:parseInt(price,10)}); if(error) throw error; setMsg(en?"Card listed.":"Carta anunciada."); setPickCard(""); setPrice(""); await load(); }
    catch(e){ setErr(e.message||String(e)); }
  }
  async function cancel(id){
    setErr(""); setMsg("");
    try{ const {error}=await db.rpc("app_cancel_listing",{p_listing:id}); if(error) throw error; await load(); }
    catch(e){ setErr(e.message||String(e)); }
  }
  if(listings===null) return <p className="muted">{en?"Loading...":"Carregando..."}</p>;
  const mine=listings.filter(l=>l.seller_id===uid);
  const others=listings.filter(l=>l.seller_id!==uid);
  const listedIds=new Set(mine.map(l=>l.card_id));
  const sellable=collection.filter(c=>!listedIds.has(c.card_id));
  return (
    <div>
      <div className="panel">
        <div className="section-title">{en?"Market":"Mercado"}</div>
        <p className="small muted" style={{marginTop:0}}>{en
          ? "On sales, the seller receives 94%. A 6% fee is split: 2% for the project, 2% for the card's photographer and 2% for conservation."
          : "Nas vendas, o vendedor recebe 94%. Uma taxa de 6% é repartida: 2% para o projeto, 2% para o fotógrafo da carta e 2% para a conservação."}</p>
        {others.length===0 ? <p className="muted">{en?"No cards for sale right now. Why not list one of yours in the field above?":"Nenhuma carta à venda agora. Que tal anunciar uma das suas no campo acima?"}</p>
        : <React.Fragment>
            <FilterBar f={f} setF={setF} biomes={biomeOptions(others)} en={en}
              sortOptions={[["price_asc",en?"Lowest price":"Preço menor"],["price_desc",en?"Highest price":"Preço maior"],["float_desc",en?"Higher float":"Float maior"],["name",en?"Name":"Nome"]]} />
            {filterCards(others,f).length===0
              ? <p className="muted">{en?"No cards match these filters.":"Nenhuma carta com esses filtros."}</p>
              : <div className="grid">{filterCards(others,f).map(l=>(
            <div key={l.listing_id}>
              <Card c={l} lang={lang} />
              {canBuy
                ? <button style={{width:"100%",marginTop:8}} onClick={()=>buy(l.listing_id)}>{en?"Buy for ":"Comprar por "}{l.price_currency}</button>
                : <div className="muted small" style={{marginTop:8}}>{en?"Purchases require your guardian's authorization.":"A compra precisa da autorização do responsável."}</div>}
            </div>
          ))}</div>}
          </React.Fragment>}
        {err && <div className="err">{err}</div>}{msg && <div className="ok">{msg}</div>}
      </div>
      <div className="panel">
        <div className="section-title">{en?"Sell a card":"Vender uma carta"}</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div style={{flex:"1 1 240px"}}>
            <label className="muted small">{en?"Card":"Carta"}</label>
            <select value={pickCard} onChange={e=>setPickCard(e.target.value)}
              style={{width:"100%",padding:"11px 12px",borderRadius:8,border:"1px solid var(--line)",background:"#e7dcc4",color:"var(--text)",marginTop:6}}>
              <option value="">{en?"Choose a card":"Escolha uma carta"}</option>
              {sellable.map(c=> <option key={c.card_id} value={c.card_id}>{c.common_name} ({rarityLabel(c.rarity_tier,en)}, {(Math.round(c.float_score*1000)/10).toFixed(1)}%)</option>)}
            </select>
          </div>
          <div style={{flex:"0 1 140px"}}>
            <label className="muted small">{en?"Price":"Preço"}</label>
            <input type="number" value={price} onChange={e=>setPrice(e.target.value)} placeholder={en?"coins":"moeda"} />
          </div>
          <button onClick={sell}>{en?"List":"Anunciar"}</button>
        </div>
      </div>
      <div className="panel">
        <div className="section-title">{en?"My listings":"Meus anúncios"}</div>
        {mine.length===0 ? <p className="muted">{en?"You don't have any listings yet. List a card in the field above to sell it for coins.":"Você ainda não tem anúncios. Anuncie uma carta no campo acima para vendê-la por moedas."}</p>
        : <div className="grid">{mine.map(l=>(
            <div key={l.listing_id}>
              <Card c={l} lang={lang} />
              <button className="ghost" style={{width:"100%",marginTop:8}} onClick={()=>cancel(l.listing_id)}>{en?"Cancel (":"Cancelar ("}{l.price_currency})</button>
            </div>
          ))}</div>}
      </div>
    </div>
  );
}

function MiniCard({ c, selected, onClick, lang }){
  const en = lang==="en";
  const r = rarityOf(c.rarity_tier);
  const pct = Math.round((Number(c.float_score)||0)*1000)/10;
  return (
    <div onClick={onClick} style={{ cursor:onClick?"pointer":"default",
        border:"1px solid "+(selected?r.color:"var(--line)"),
        background:selected? r.color+"18":"var(--panel2)", borderRadius:10, padding:"8px 10px", marginBottom:8 }}>
      <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
        <b>{c.common_name}</b><span style={{color:r.color,fontWeight:700,fontSize:12}}>{rarityLabel(c.rarity_tier,en)}</span>
      </div>
      <div className="muted small">{c.art_style} - Float {pct.toFixed(1)}%{c.serial_number?" - #"+c.serial_number:""}</div>
    </div>
  );
}

const TRADE_STATUS_LABEL = { pendente:"pendente", aceita:"aceita", recusada:"recusada", cancelada:"cancelada" };
const TRADE_STATUS_LABEL_EN = { pendente:"pending", aceita:"accepted", recusada:"declined", cancelada:"cancelled" };

// ===================== VISAO DE UMA PROPOSTA =====================
function OfferView({ o, uid, actions, lang }){
  const en = lang==="en";
  const youAreFrom = o.from_user_id===uid;
  const otherName = youAreFrom ? (o.to_username||(en?"player":"jogador")) : (o.from_username||(en?"player":"jogador"));
  const items = o.items||[];
  const mineItems = items.filter(it=> it.offered_by===uid);
  const theirItems = items.filter(it=> it.offered_by!==uid);
  const fmt = it => it.common_name+" ("+rarityLabel(it.rarity,en)+", "+(Math.round(it.float*1000)/10).toFixed(1)+"%)";
  const statusLabel = en ? (TRADE_STATUS_LABEL_EN[o.status]||o.status) : (TRADE_STATUS_LABEL[o.status]||o.status);
  return (
    <div style={{border:"1px solid var(--line)",borderRadius:10,padding:12,marginBottom:10}}>
      <div className="muted small">{en?"With ":"Com "}{otherName} - {statusLabel}</div>
      <div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:6}}>
        <div style={{flex:"1 1 200px"}}>
          <div className="small" style={{fontWeight:700}}>{en?"You give":"Você dá"}</div>
          {mineItems.length? mineItems.map(it=><div key={it.card_id} className="muted small">{fmt(it)}</div>) : <div className="muted small">{en?"nothing":"nada"}</div>}
        </div>
        <div style={{flex:"1 1 200px"}}>
          <div className="small" style={{fontWeight:700}}>{en?"You receive":"Você recebe"}</div>
          {theirItems.length? theirItems.map(it=><div key={it.card_id} className="muted small">{fmt(it)}</div>) : <div className="muted small">{en?"nothing":"nada"}</div>}
        </div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:10}}>{actions}</div>
    </div>
  );
}

// ===================== ABA TROCAS =====================
function TradesTab({ session, onChanged, onNavigate, lang }){
  const en = lang==="en";
  const uid = session.user.id;
  const [collection,setCollection]=useState([]);
  const [forTrade,setForTrade]=useState({});
  const [offers,setOffers]=useState([]);
  const [err,setErr]=useState(""); const [msg,setMsg]=useState("");
  const [searchName,setSearchName]=useState("");
  const [binder,setBinder]=useState(null);
  const [selTheirs,setSelTheirs]=useState({});
  const [selMine,setSelMine]=useState({});
  const [onlyDup,setOnlyDup]=useState(false);

  async function load(){
    const [{data:coll},{data:ci},{data:ofs}]=await Promise.all([
      db.from("v_card_full").select("*").order("minted_at",{ascending:false}),
      db.from("card_instances").select("id, for_trade"),
      db.from("v_trade_offers_detail").select("*").order("created_at",{ascending:false}),
    ]);
    setCollection(coll||[]);
    const ft={}; (ci||[]).forEach(x=> ft[x.id]=x.for_trade); setForTrade(ft);
    setOffers(ofs||[]);
  }
  useEffect(()=>{ load(); },[]);

  async function toggleTrade(cardId){
    setErr("");
    const next=!forTrade[cardId];
    try{ const {error}=await db.rpc("app_set_for_trade",{p_card:cardId,p_on:next}); if(error) throw error; setForTrade(s=>({...s,[cardId]:next})); }
    catch(e){ setErr(e.message||String(e)); }
  }
  async function search(){
    setErr(""); setBinder(null); setSelTheirs({});
    if(!searchName.trim()) return;
    try{ const {data,error}=await db.rpc("app_player_binder",{p_username:searchName.trim()}); if(error) throw error; setBinder(data||[]); }
    catch(e){ setErr(e.message||String(e)); }
  }
  async function sendOffer(){
    setErr(""); setMsg("");
    const theirs=Object.keys(selTheirs).filter(k=>selTheirs[k]);
    const mine=Object.keys(selMine).filter(k=>selMine[k]);
    if(theirs.length===0 && mine.length===0){ setErr(en?"Select at least one card.":"Selecione ao menos uma carta."); return; }
    try{ const {error}=await db.rpc("app_create_trade_by_name",{ p_to_username:searchName.trim(), p_from_cards:mine, p_to_cards:theirs }); if(error) throw error;
      setMsg(en?"Offer sent.":"Proposta enviada."); setSelTheirs({}); setSelMine({}); setBinder(null); setSearchName(""); await load(); }
    catch(e){ setErr(e.message||String(e)); }
  }
  async function respond(id,accept){
    setErr(""); setMsg("");
    try{ const {error}=await db.rpc("app_respond_trade",{p_offer:id,p_accept:accept}); if(error) throw error; await load(); onChanged(); }
    catch(e){ setErr(e.message||String(e)); }
  }
  async function cancelOffer(id){
    setErr("");
    try{ const {error}=await db.rpc("app_cancel_trade",{p_offer:id}); if(error) throw error; await load(); }
    catch(e){ setErr(e.message||String(e)); }
  }

  const incoming=offers.filter(o=>o.to_user_id===uid && o.status==="pendente");
  const outgoing=offers.filter(o=>o.from_user_id===uid && o.status==="pendente");

  const dupKey = c => (c.species_id||"")+"|"+(c.primary_biome||"");
  const dupCount = {}; collection.forEach(c=>{ const k=dupKey(c); dupCount[k]=(dupCount[k]||0)+1; });
  const isDup = c => dupCount[dupKey(c)] > 1;
  const dupTotal = collection.filter(isDup).length;
  const vitrine = onlyDup ? collection.filter(isDup) : collection;

  return (
    <div>
      <div className="panel">
        <div className="section-title">{en?"Offers received":"Propostas recebidas"}</div>
        {incoming.length===0? <p className="muted">{en?"No offers received yet. Leave cards in your showcase so other players can propose trades.":"Nenhuma proposta recebida ainda. Deixe cartas na vitrine para que outros jogadores ofereçam trocas."}</p>
        : incoming.map(o=> <OfferView key={o.offer_id} o={o} uid={uid} lang={lang}
            actions={<React.Fragment><button onClick={()=>respond(o.offer_id,true)}>{en?"Accept":"Aceitar"}</button>
              <button className="ghost" onClick={()=>respond(o.offer_id,false)}>{en?"Decline":"Recusar"}</button></React.Fragment>} />)}
      </div>

      <div className="panel">
        <div className="section-title">{en?"Propose a trade":"Propor troca"}</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end",marginBottom:10}}>
          <div style={{flex:"1 1 220px"}}>
            <label className="muted small">{en?"Other player's name":"Nome do outro jogador"}</label>
            <input value={searchName} onChange={e=>setSearchName(e.target.value)} placeholder={en?"player name":"nome de jogador"} />
          </div>
          <button onClick={search}>{en?"Search showcase":"Buscar vitrine"}</button>
        </div>
        {binder!==null && (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
            <div>
              <div className="muted small" style={{marginBottom:6}}>{en?"Their cards (what you want)":"Cartas dele (o que você quer)"}</div>
              {binder.length===0? <p className="muted small">{en?"This player has no cards in their showcase.":"Esse jogador não tem cartas na vitrine."}</p>
              : binder.map(c=> <MiniCard key={c.card_id} c={c} selected={!!selTheirs[c.card_id]} onClick={()=>setSelTheirs(s=>({...s,[c.card_id]:!s[c.card_id]}))} lang={lang} />)}
            </div>
            <div>
              <div className="muted small" style={{marginBottom:6}}>{en?"Your cards (what you offer)":"Suas cartas (o que você oferece)"}</div>
              {collection.map(c=> <MiniCard key={c.card_id} c={c} selected={!!selMine[c.card_id]} onClick={()=>setSelMine(s=>({...s,[c.card_id]:!s[c.card_id]}))} lang={lang} />)}
            </div>
          </div>
        )}
        {binder!==null && <button onClick={sendOffer} style={{marginTop:10}}>{en?"Send offer":"Enviar proposta"}</button>}
        {err && <div className="err">{err}</div>}{msg && <div className="ok">{msg}</div>}
      </div>

      <div className="panel">
        <div className="section-title">{en?"Offers sent":"Propostas enviadas"}</div>
        {outgoing.length===0? <p className="muted">{en?"No offers sent. You can propose trades from cards in other players' showcases.":"Nenhuma proposta enviada. Você pode propor trocas a partir das cartas na vitrine de outros jogadores."}</p>
        : outgoing.map(o=> <OfferView key={o.offer_id} o={o} uid={uid} lang={lang}
            actions={<button className="ghost" onClick={()=>cancelOffer(o.offer_id)}>{en?"Cancel":"Cancelar"}</button>} />)}
      </div>

      <div className="panel">
        <div className="section-title">{en?"My trade showcase":"Minha vitrine de troca"}</div>
        <p className="muted small">{en?"Mark the cards you're willing to trade. Only those are visible to others.":"Marque as cartas que você aceita trocar. Só elas ficam visíveis para os outros."}</p>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:10}}>
          <button className={onlyDup?"":"ghost"} style={{padding:"6px 12px",fontSize:13}} onClick={()=>setOnlyDup(v=>!v)}>
            {onlyDup?(en?"Showing only duplicates":"Mostrando só repetidas"):(en?"Show only duplicates":"Mostrar só repetidas")}</button>
          <span className="muted small">{dupTotal>0
            ? (en?("You have "+dupTotal+" duplicate card"+(dupTotal>1?"s":"")+" (same species and biome you own more than once)."):("Você tem "+dupTotal+" carta"+(dupTotal>1?"s":"")+" repetida"+(dupTotal>1?"s":"")+" (espécie e bioma que você tem em duplicata)."))
            : (en?"You don't have any duplicate cards right now.":"Você não tem cartas repetidas no momento.")}</span>
        </div>
        {collection.length===0? <div><p className="muted" style={{marginBottom:8}}>{en?"You don't have any cards to showcase yet.":"Você ainda não tem cartas para colocar na vitrine."}</p>{onNavigate && <button onClick={()=>onNavigate("colecao")}>{en?"Open a pack":"Abrir um pacote"}</button>}</div>
        : onlyDup && vitrine.length===0? <p className="muted small">{en?"No duplicate cards to show.":"Nenhuma carta repetida para mostrar."}</p>
        : <div className="grid">{vitrine.map(c=>(
            <div key={c.card_id}>
              <Card c={c} lang={lang} />
              {dupCount[dupKey(c)]>1 && <div className="muted small" style={{textAlign:"center",marginTop:4}}>{en?("You have "+dupCount[dupKey(c)]+" of this"):("Você tem "+dupCount[dupKey(c)]+" desta")}</div>}
              <button className={forTrade[c.card_id]?"":"ghost"} style={{width:"100%",marginTop:8}} onClick={()=>toggleTrade(c.card_id)}>
                {forTrade[c.card_id]?(en?"In showcase (remove)":"Na vitrine (remover)"):(en?"Add to showcase":"Adicionar a vitrine")}</button>
            </div>
          ))}</div>}
      </div>
    </div>
  );
}

function FamilyPanel({ lang }){
  const en = lang==="en";
  const [children,setChildren]=useState(null);
  const [code,setCode]=useState(null);
  const [redeem,setRedeem]=useState("");
  const [msg,setMsg]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);

  async function load(){
    try{ const { data }=await db.rpc("app_family_children"); setChildren(Array.isArray(data)?data:(data||[])); }
    catch(e){ setChildren([]); }
  }
  useEffect(()=>{ load(); },[]);

  async function invite(){
    setBusy(true); setErr(""); setMsg("");
    try{ const { data }=await db.rpc("app_family_create_invite");
      if(data && data.ok){ setCode(data.code); }
      else setErr(data && data.reason==="apenas_responsavel_adulto" ? (en?"Only an adult guardian can generate invites.":"Apenas um responsável adulto pode gerar convites.") : (en?"Could not generate the invite.":"Não foi possível gerar o convite."));
    }catch(e){ setErr(en?"Could not generate the invite.":"Não foi possível gerar o convite."); } finally{ setBusy(false); }
  }
  async function doRedeem(){
    if(!redeem.trim()) return;
    setBusy(true); setErr(""); setMsg("");
    try{ const { data }=await db.rpc("app_family_redeem_invite",{ p_code:redeem.trim() });
      if(data && data.ok){ setMsg(en?"Link complete. Your account is now under a guardian.":"Vínculo concluído. Sua conta agora está sob um responsável."); setRedeem(""); load(); }
      else { const r=data && data.reason;
        setErr(en
          ? (r==="codigo_invalido"?"Invalid or expired code.":r==="proprio_codigo"?"You can't use your own code.":r==="ja_vinculado"?"Your account already has a guardian.":"Could not link the account.")
          : (r==="codigo_invalido"?"Código inválido ou expirado.":r==="proprio_codigo"?"Você não pode usar o próprio código.":r==="ja_vinculado"?"Sua conta já tem um responsável.":"Não foi possível vincular.")); }
    }catch(e){ setErr(en?"Could not link the account.":"Não foi possível vincular."); } finally{ setBusy(false); }
  }
  async function setControl(child,key,val){
    setChildren(cs=>cs.map(c=>c.id===child?{...c,[key]:val}:c));
    try{ await db.rpc("app_family_set_control",{ p_child:child, p_key:key, p_value:val }); }
    catch(e){ load(); }
  }
  async function unlink(child){
    setBusy(true);
    try{ await db.rpc("app_family_unlink",{ p_child:child }); load(); }
    catch(e){} finally{ setBusy(false); }
  }

  const feats=[
    {key:"purchases", label:en?"Purchases (market, packs and cosmetics)":"Compras (mercado, pacotes e cosméticos)", show:"show_purchases", allow:"allow_purchases", allowLabel:en?"Allow purchases":"Permitir compra"},
    {key:"ranked",    label:en?"Ranked":"Ranqueada",                                show:"show_ranked",    allow:"allow_ranked",    allowLabel:en?"Allow playing":"Permitir jogar"},
  ];

  return (
    <div className="panel">
      <div className="section-title">{en?"Family":"Família"}</div>
      <p className="muted small" style={{marginTop:0}}>{en?"For guardians: link a child's account and set what they can do. Permissions start turned off.":"Para responsáveis: vincule a conta de uma criança e defina o que ela pode fazer. As permissões começam desligadas."}</p>

      <div style={{marginBottom:10}}>
        <button onClick={invite} disabled={busy}>{en?"Generate invite for a child":"Gerar convite para uma criança"}</button>
        {code && <p className="small" style={{marginTop:8}}>{en?"Code: ":"Código: "}<b style={{fontFamily:"monospace",fontSize:16}}>{code}</b><br/><span className="muted">{en?"Valid for 24 hours. Ask the child to type this code in Account, Family, on their account.":"Vale por 24 horas. Peça para a criança digitar este código em Conta, Família, na conta dela."}</span></p>}
      </div>

      {children===null ? <p className="muted small">{en?"Loading...":"Carregando..."}</p>
        : children.length===0 ? <p className="muted small">{en?"No child linked yet.":"Nenhuma criança vinculada ainda."}</p>
        : <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {children.map(c=>(
              <div key={c.id} style={{border:"1px solid var(--line)",borderRadius:8,padding:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <b>{c.username||(en?"(no name)":"(sem nome)")}</b>
                  <button className="ghost small" onClick={()=>unlink(c.id)} disabled={busy}>{en?"Unlink":"Desvincular"}</button>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {feats.map(f=>(
                    <div key={f.key}>
                      <div className="small" style={{fontWeight:600,marginBottom:2}}>{f.label}</div>
                      <div style={{display:"flex",gap:16}}>
                        <label className="small" style={{display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}>
                          <input type="checkbox" checked={c[f.show]!==false} onChange={e=>setControl(c.id,f.show,e.target.checked)} />
                          <span>{en?"Visible":"Visível"}</span>
                        </label>
                        <label className="small" style={{display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}>
                          <input type="checkbox" checked={!!c[f.allow]} onChange={e=>setControl(c.id,f.allow,e.target.checked)} />
                          <span>{f.allowLabel}</span>
                        </label>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>}

      <div style={{borderTop:"1px solid var(--line)",marginTop:12,paddingTop:12}}>
        <div className="small" style={{fontWeight:700,marginBottom:6}}>{en?"I have a guardian":"Tenho um responsável"}</div>
        <p className="muted small" style={{marginTop:0}}>{en?"Got a code from your guardian? Type it below to link your account.":"Recebeu um código do seu responsável? Digite abaixo para vincular sua conta."}</p>
        <div style={{display:"flex",gap:8}}>
          <input value={redeem} onChange={e=>setRedeem(e.target.value.toUpperCase())} placeholder={en?"Code":"Código"} style={{flex:1}} />
          <button onClick={doRedeem} disabled={busy||!redeem.trim()}>{en?"Link":"Vincular"}</button>
        </div>
      </div>

      {err && <div className="err" style={{marginTop:8}}>{err}</div>}
      {msg && <div className="ok" style={{marginTop:8}}>{msg}</div>}
    </div>
  );
}

function SettingsTab({ session, profile, onChanged, lang }){
  const en = lang==="en";
  const [username,setUsername]=useState("");
  const [pw1,setPw1]=useState(""); const [pw2,setPw2]=useState("");
  const [email,setEmail]=useState("");
  const [msg,setMsg]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  useEffect(()=>{ if(profile&&profile.username) setUsername(profile.username); },[profile]);
  async function saveUsername(){
    setErr("");setMsg("");setBusy(true);
    try{ const {error}=await db.rpc("app_set_username",{p_username:username}); if(error) throw error; setMsg(en?"Name updated.":"Nome atualizado."); onChanged(); }
    catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  async function savePassword(){
    setErr("");setMsg("");
    if(pw1.length<6){ setErr(en?"The password needs at least 6 characters.":"A senha precisa de ao menos 6 caracteres."); return; }
    if(pw1!==pw2){ setErr(en?"The passwords don't match.":"As senhas não coincidem."); return; }
    setBusy(true);
    try{ const {error}=await db.auth.updateUser({password:pw1}); if(error) throw error; setMsg(en?"Password updated.":"Senha atualizada."); setPw1("");setPw2(""); }
    catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  async function saveEmail(){
    setErr("");setMsg("");
    if(!email.trim()){ setErr(en?"Enter an email.":"Informe um email."); return; }
    setBusy(true);
    try{ const {error}=await db.auth.updateUser({email:email.trim()}, { emailRedirectTo: window.location.origin }); if(error) throw error; setMsg(en?"Email change request sent. Confirm via the link sent to the new address.":"Pedido de troca de email enviado. Confirme pelo link no novo endereço."); setEmail(""); }
    catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  return (
    <div>
      <div className="panel">
        <div className="section-title">{en?"Player name":"Nome de jogador"}</div>
        <p className="muted small">{en?"Current email: ":"Email atual: "}{session.user.email}</p>
        <div className="field"><label>{en?"Player name":"Nome de jogador"}</label>
          <input value={username} onChange={e=>setUsername(e.target.value)} /></div>
        <button onClick={saveUsername} disabled={busy}>{en?"Save name":"Salvar nome"}</button>
      </div>
      <div className="panel">
        <div className="section-title">{en?"Change password":"Trocar senha"}</div>
        <div className="field"><label>{en?"New password":"Nova senha"}</label>
          <input type="password" value={pw1} onChange={e=>setPw1(e.target.value)} /></div>
        <div className="field"><label>{en?"Confirm new password":"Confirmar nova senha"}</label>
          <input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} /></div>
        <button onClick={savePassword} disabled={busy}>{en?"Save password":"Salvar senha"}</button>
      </div>
      <div className="panel">
        <div className="section-title">{en?"Change email":"Trocar email"}</div>
        <div className="field"><label>{en?"New email":"Novo email"}</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder={session.user.email} /></div>
        <button onClick={saveEmail} disabled={busy}>{en?"Save email":"Salvar email"}</button>
        <p className="muted small" style={{marginTop:8}}>{en?"Changing your email may require confirmation via the link sent to the new address.":"A troca de email pode exigir confirmação pelo link enviado ao novo endereço."}</p>
      </div>
      <FamilyPanel lang={lang} />
      {err && <div className="err">{err}</div>}{msg && <div className="ok">{msg}</div>}
    </div>
  );
}

                <div key={r.player_id} onClick={()=>r.username&&onOpenPlayer(r.username)} style={{cursor:"pointer",display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:8,background:r.player_id===uid?"#2f9e6f1f":"transparent",border:"1px solid "+(r.player_id===uid?"#3fb950":"transparent")}}>
                  <span style={{fontWeight:800,width:30,textAlign:"right",color:i<3?"#f0b429":"var(--muted)"}}>{i+1}</span>
                  <span style={{flex:1,fontWeight:600}}>{r.username||(en?"player":"jogador")}{r.player_id===uid?(en?" (you)":" (você)"):""}</span>
                  <span className="muted small">{r.wins}-{r.losses}-{r.draws}</span>
                  <span style={{fontWeight:800,width:48,textAlign:"right"}}>{r.rating}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  if(rows===null) return <div>{seg}<p className="muted">{en?"Loading...":"Carregando..."}</p></div>;
  const inTop = rows.some(r=>r.user_id===uid);
  function line(r, highlight){
    return (
      <div key={r.user_id} className="row" onClick={()=>r.username&&onOpenPlayer(r.username)} style={Object.assign({cursor:"pointer"}, highlight?{background:"#2f9e6f1f",borderRadius:8,padding:"10px 10px"}:{})}>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <span style={{fontWeight:800,width:30,textAlign:"right",color:r.posicao<=3?"#f0b429":"var(--muted)"}}>{r.posicao}</span>
          <span style={{fontWeight:600}}>{r.username}{r.user_id===uid?(en?" (you)":" (você)"):""}</span>
        </div>
        <span className="muted small">{r.education_points} pts</span>
      </div>
    );
  }
  return (
    <div>
      {seg}
      <div className="panel">
        <div className="section-title">{en?"Knowledge leaderboard":"Ranking de conhecimento"}</div>
        <p className="muted small">{en?"Points come from the quiz. The more you learn about the fauna, the higher you climb.":"Os pontos vêm do quiz. Quanto mais você aprende sobre a fauna, mais sobe."}</p>
        {rows.length===0
          ? <p className="muted">{en?"No one has scored yet. Play the quiz to open the leaderboard.":"Ninguém pontuou ainda. Jogue o quiz para abrir o ranking."}</p>
          : rows.map(r=> line(r, r.user_id===uid))}
        {!inTop && me ? (
          <div style={{marginTop:10,paddingTop:8,borderTop:"1px solid var(--line)"}}>
            <div className="muted small" style={{marginBottom:4}}>{en?"Your position":"Sua posição"}</div>
            {line(me, true)}
          </div>
        ) : null}
      </div>
    </div>
  );
}

function NavGroup({ label, active, items, current, onPick, t, badges={} }) {
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    function onDoc(e){ if(ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown",onDoc);
    return ()=>document.removeEventListener("mousedown",onDoc);
  },[]);
  return (
    <div ref={ref} style={{position:"relative"}}>
      <div className={"tab"+(active?" active":"")} onClick={()=>setOpen(o=>!o)}>
        {label} <span style={{fontSize:10,opacity:.7}}>{"\u25BE"}</span>
        {items.some(i=>badges[i.key]>0) && <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:"#e5534b",marginLeft:5,verticalAlign:"middle"}} />}
      </div>
      {open && (
        <div className="navmenu">
          {items.map(it=>(
            <div key={it.key}
              className={"navmenu-item "+(current===it.key?"on":"")+(it.disabled?" off":"")}
              onClick={()=>{ if(it.disabled) return; onPick(it.key); setOpen(false); }}>
              {t("tab_"+it.key)}{it.disabled? <span className="muted small"> · {t("soon")}</span>:null}{badges[it.key]>0 ? <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:"#e5534b",marginLeft:6,verticalAlign:"middle"}} /> : null}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ===================== ABA JOGAR (Desafios de Campo) =====================
function challengeInfo(attr,dir,en){
  const M={
    mass:{high:en?"Heavier":"Mais pesado", low:en?"Lighter":"Mais leve", u:"kg", s:en?"mass":"peso"},
    length:{high:en?"Longer":"Mais comprido", low:en?"Shorter":"Mais curto", u:"cm", s:en?"length":"comprimento"},
    lifespan:{high:en?"Longest-lived":"Maior longevidade", low:en?"Shortest-lived":"Menor longevidade", u:en?"years":"anos", s:en?"longevity":"longevidade"},
  };
  return { label:M[attr][dir], unit:M[attr].u, sub:M[attr].s };
}

function JogarTab({ lang, onChanged, canRanked=true, showRanked=true }){
  const en=lang==="en";
  const [collection,setCollection]=useState(null);
  const [selected,setSelected]=useState([]);
  const [phase,setPhase]=useState("setup");
  const [match,setMatch]=useState(null);
  const [hand,setHand]=useState([]);
  const [scores,setScores]=useState({player:0,nature:0});
  const [reveal,setReveal]=useState(null);
  const [final,setFinal]=useState(null);
  const [picked,setPicked]=useState(null);
  const [question,setQuestion]=useState(null);
  const [chosen,setChosen]=useState(null);
  const [answered,setAnswered]=useState(null);
  const [correctOpt,setCorrectOpt]=useState(null);
  const [secs,setSecs]=useState(15);
  const [mode,setMode]=useState("solo");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const resolvingRef = useRef(false);
  const handStartY = useRef(0);
  const [f,setF]=useState({q:"",rarity:"",biome:"",sort:"name"});
  const [showHow,setShowHow]=useState(false);

  function savedTeam(coll){
    coll = coll || collection || [];
    try{
      const saved=JSON.parse(localStorage.getItem("wl_lastteam")||"[]");
      if(Array.isArray(saved) && saved.length){
        const have=new Set(coll.map(c=>c.card_id));
        return saved.filter(id=>have.has(id)).slice(0,5);
      }
    }catch(e){}
    return [];
  }

  useEffect(()=>{ db.from("v_card_full").select("*").order("minted_at",{ascending:false}).then(({data})=>{
    const coll=data||[]; setCollection(coll);
    const keep=savedTeam(coll);
    if(keep.length) setSelected(keep);
  }); },[]);

  useEffect(()=>{
    if(!(picked && question)) return;
    const card=picked; let left=15; setSecs(15);
    const iv=setInterval(()=>{ left-=1; setSecs(left); if(left<=0) clearInterval(iv); },1000);
    const to=setTimeout(()=>{ resolve(card,null,null); },15000);
    return ()=>{ clearInterval(iv); clearTimeout(to); };
  },[question]);

  function toggle(id){
    setErr("");
    setSelected(s=> s.includes(id) ? s.filter(x=>x!==id) : (s.length>=5? s : [...s,id]));
  }
  async function start(){
    if(selected.length!==5){ setErr(en?"Pick exactly 5 cards.":"Escolha exatamente 5 cartas."); return; }
    setBusy(true); setErr("");
    try{
      const { data, error }=await db.rpc("app_match_start",{ p_cards:selected });
      if(error) throw error;
      try{ localStorage.setItem("wl_lastteam", JSON.stringify(selected)); }catch(e){}
      setMatch({ matchId:data.match_id, roundNo:data.round_no, rounds:data.rounds, challenge:data.challenge });
      setHand(collection.filter(c=>selected.includes(c.card_id)));
      setScores({player:0,nature:0}); setReveal(null); setFinal(null); setPhase("playing");
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  async function choose(card){
    if(busy) return;
    setBusy(true); setErr(""); setReveal(null);
    try{
      const { data, error }=await db.rpc("app_match_question",{ p_match:match.matchId, p_card:card.card_id });
      if(error) throw error;
      if(data && data.question_id){ setPicked(card); setQuestion(data); }
      else { await resolve(card, null, null); }
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  function applyResult(data, card){
    setReveal({ ...data.round, playerCard:card });
    setScores(data.scores);
    setHand(h=>h.filter(c=>c.card_id!==card.card_id));
    setPicked(null); setQuestion(null); setChosen(null); setAnswered(null); setCorrectOpt(null);
    if(data.finished){ setFinal({ result:data.result, reward:data.reward_coins, limit:data.limit_reached }); if(onChanged) onChanged(); }
    else { setMatch(m=>({ ...m, roundNo:data.next.round_no, challenge:data.next.challenge })); }
    setBusy(false); resolvingRef.current=false;
  }
  async function resolve(card, qid, oid){
    if(resolvingRef.current) return;
    resolvingRef.current=true;
    setBusy(true); setErr("");
    try{
      const { data, error }=await db.rpc("app_match_play",{ p_match:match.matchId, p_card:card.card_id, p_question:qid, p_option:oid });
      if(error) throw error;
      applyResult(data, card);
    }catch(e){ setErr(e.message||String(e)); setBusy(false); resolvingRef.current=false; }
  }
  async function answer(card, opt){
    if(resolvingRef.current) return;
    resolvingRef.current=true;
    setBusy(true); setErr(""); setChosen(opt.id);
    try{
      const { data, error }=await db.rpc("app_match_play",{ p_match:match.matchId, p_card:card.card_id, p_question:question.question_id, p_option:opt.id });
      if(error) throw error;
      const correct = !!(data.round && data.round.player && data.round.player.knowledge_bonus);
      setCorrectOpt(data.correct_option_id||null);
      setAnswered(correct);
      setTimeout(()=>applyResult(data, card), 1150);
    }catch(e){ setErr(e.message||String(e)); setBusy(false); setChosen(null); setAnswered(null); setCorrectOpt(null); resolvingRef.current=false; }
  }
  function reset(){ setPhase("setup"); setSelected(savedTeam()); setMatch(null); setHand([]); setReveal(null); setFinal(null); setPicked(null); setQuestion(null); setChosen(null); setAnswered(null); setCorrectOpt(null); setErr(""); }

  if(collection===null) return <p className="muted">{en?"Loading...":"Carregando..."}</p>;

  const toggleEl = showRanked ? (
    <div className="seg" style={{marginBottom:12}}>
      <button className={mode==="solo"?"on":""} onClick={()=>setMode("solo")}>{en?"Vs nature":"Contra a natureza"}</button>
      <button className={mode==="ranked"?"on":""} onClick={()=>setMode("ranked")}>{en?"Ranked":"Ranqueada"}</button>
    </div>
  ) : null;
  if(showRanked && mode==="ranked") return <div>{toggleEl}{canRanked
    ? <RankedTab lang={lang} collection={collection} onChanged={onChanged} />
    : <div className="panel"><p className="muted" style={{margin:0}}>{en?"Ranked matches need a guardian's authorization.":"As partidas ranqueadas precisam da autorização do responsável."}</p></div>}</div>;

  if(phase==="setup"){
    return (
      <div>
        {toggleEl}
        <div className="panel">
          <div className="section-title">{en?"Field Challenges":"Desafios de Campo"}</div>
          <p className="small" style={{marginTop:0,marginBottom:0}}>{en
            ? "Pick 5 cards. Each round reveals a challenge based on a real trait, sometimes the biggest value, sometimes the smallest. Play one card against nature and win the most of 5 rounds."
            : "Escolha 5 cartas. Cada rodada revela um desafio baseado em uma característica real, às vezes o maior valor, às vezes o menor. Jogue uma carta contra a natureza e vença a maioria das 5 rodadas."}</p>
        </div>
        <div className="panel">
          <div onClick={()=>setShowHow(v=>!v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
            <div className="section-title" style={{margin:0}}>{en?"How it works":"Como funciona"}</div>
            <span className="muted" style={{fontSize:20,lineHeight:1}}>{showHow?"−":"+"}</span>
          </div>
          {showHow && (
            <div style={{marginTop:10,display:"grid",gap:8}}>
              {(en ? [
                "Pick 5 cards for your team.",
                "Each round brings a challenge based on a real trait. Sometimes the highest value wins, sometimes the lowest. Some rounds happen in a biome.",
                "Play the card that best answers the challenge. If it belongs to the round's biome, it gets a 15% boost.",
                "Before the reveal, a question about the animal appears. A correct answer gives another boost. You can skip it, and there is a 15 second timer.",
                "Win the most of the 5 rounds. Victories give coins, up to a daily limit."
              ] : [
                "Escolha 5 cartas para o seu time.",
                "Cada rodada traz um desafio baseado em uma característica real. Às vezes vence o maior valor, às vezes o menor. Algumas rodadas acontecem num bioma.",
                "Jogue a carta que melhor responde ao desafio. Se ela é do bioma da rodada, ganha um reforço de 15%.",
                "Antes de revelar, aparece uma pergunta sobre o animal. Acertar dá outro reforço. Dá para pular, e há um tempo de 15 segundos.",
                "Vença a maioria das 5 rodadas. Vitórias rendem moeda, com um limite diário."
              ]).map((s,i)=>(
                <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                  <span className="badge" style={{background:"var(--accent)",color:"#f7f2e8",minWidth:22,textAlign:"center",flexShrink:0}}>{i+1}</span>
                  <span className="small" style={{flex:1}}>{s}</span>
                </div>
              ))}
            </div>
          )}
        </div>
        {collection.length<5 ? (
          <div className="panel"><p className="muted" style={{margin:0}}>{en
            ? "You need at least 5 cards to play. Open some packs in the Collection tab."
            : "Você precisa de pelo menos 5 cartas para jogar. Abra pacotes na aba Coleção."}</p></div>
        ) : (
          <div className="panel">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div className="section-title" style={{margin:0}}>{en?"Your team":"Seu time"}</div>
              <span className="muted small">{selected.length} / 5</span>
            </div>
            <SelectedRow ids={selected} collection={collection} onRemove={toggle} en={en} />
            {err && <div className="err">{err}</div>}
            <button onClick={start} disabled={busy||selected.length!==5} style={{width:"100%",marginBottom:10}}>
              {busy?(en?"Starting...":"Iniciando..."):(en?"Start match":"Começar partida")}</button>
            <FilterBar f={f} setF={setF} biomes={biomeOptions(collection)} en={en} artFilter
              sortOptions={[["name",en?"Name":"Nome"],["float_desc",en?"Higher float":"Float maior"],["float_asc",en?"Lower float":"Float menor"],["mass_desc",en?"Higher mass":"Maior massa"],["mass_asc",en?"Lower mass":"Menor massa"],["length_desc",en?"Higher length":"Maior comprimento"],["length_asc",en?"Lower length":"Menor comprimento"],["lifespan_desc",en?"Higher lifespan":"Maior longevidade"],["lifespan_asc",en?"Lower lifespan":"Menor longevidade"]]} />
            <div>
              {filterCards(collection,f).map(c=>(
                <PickCard key={c.card_id} c={c} selected={selected.includes(c.card_id)} onClick={()=>toggle(c.card_id)} en={en} />
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  const ci = challengeInfo(match.challenge.attr, match.challenge.dir, en);
  const cbi = match.challenge.biome ? biomeStyle(match.challenge.biome) : null;
  return (
    <div>
      {toggleEl}
      <div className="panel">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div className="section-title" style={{margin:0}}>{en?"Field Challenges":"Desafios de Campo"}</div>
          <span className="muted small">{en?"You":"Você"} {scores.player} · {en?"Nature":"Natureza"} {scores.nature}</span>
        </div>
      </div>

      {err && <div className="panel"><div className="err">{err}</div></div>}

      {(()=>{
        const fldb = reveal ? reveal.biome : (match.challenge && match.challenge.biome);
        const fbs = fldb ? biomeStyle(fldb) : null;
        const fieldStyle = fbs ? {background:"linear-gradient(180deg, "+fbs.c+"1f, "+fbs.c+"0a), var(--panel)", borderColor:fbs.c+"66"} : {};
        return (
        <div className="btable">
          <div className="bopp">
            <div className="muted small" style={{marginBottom:5}}>{en?"Nature's hand":"Mão da natureza"}</div>
            <div className="bopp-hand">
              {hand.length>0
                ? hand.map((c,i)=>(<div key={i} className="bback"><WildLensMark size={15} idp={"bb"+i} /></div>))
                : <span className="muted small">—</span>}
            </div>
          </div>

          <div className="bfield" style={fieldStyle}>
            {reveal ? (()=>{
              const rc=challengeInfo(reveal.attr, reveal.dir, en);
              const fval = reveal.attr==="mass" ? fmtMass : fmtNum;
              const win=reveal.winner==="player", tie=reveal.winner==="empate";
              const col=tie?"#9aa0a6":(win?"#3fb950":"#f0857d");
              const f=0.15, sign=reveal.dir==="high"?1:-1;
              const pbase=Number(reveal.player.value)||0;
              let p=pbase, pBio=0, pKn=0;
              if(reveal.player.biome_bonus){ const d=p*sign*f; pBio=d; p+=d; }
              if(reveal.player.knowledge_bonus){ const d=p*sign*f; pKn=d; p+=d; }
              const peff=p, pBoost=reveal.player.biome_bonus||reveal.player.knowledge_bonus;
              const nbase=Number(reveal.nature.value)||0;
              let nn=nbase, nBio=0;
              if(reveal.nature.biome_bonus){ const d=nn*sign*f; nBio=d; nn+=d; }
              const neff=nn, nBoost=reveal.nature.biome_bonus;
              const sd=x=> (x>=0?"+":"−")+fval(Math.abs(x));
              const tag=(txt,c)=> <span style={{fontSize:9,background:c+"22",color:c,borderRadius:5,padding:"1px 5px",marginLeft:4,whiteSpace:"nowrap",display:"inline-block",marginTop:3}}>{txt}</span>;
              return (
                <div>
                  <div className="muted small" style={{marginBottom:8,textAlign:"center"}}>{en?"Round result":"Resultado da rodada"} · {rc.label}{reveal.biome?" · "+biomeStyle(reveal.biome).s:""}</div>
                  <div className="duel">
                    <div className="duel-side">
                      <div className="small muted">{en?"You":"Você"}</div>
                      <div className="duel-card up"><CardFace c={reveal.playerCard} lang={lang} /></div>
                      <div className="duel-val" style={{color:col}}>{fval(peff)} <span className="muted" style={{fontSize:11}}>{rc.unit}</span></div>
                      {pBoost ? <div className="muted duel-base">{(en?"base ":"base ")+fval(pbase)}</div> : null}
                      <div>{reveal.player.biome_bonus?tag((en?"biome ":"bioma ")+sd(pBio),"#2f9e57"):null}{reveal.player.knowledge_bonus?tag((en?"knowledge ":"saber ")+sd(pKn),"#3a7bd0"):null}</div>
                    </div>
                    <div className="duel-vs" style={{color:col}}>{tie?"=":(win?"❯":"❮")}</div>
                    <div className="duel-side">
                      <div className="small muted">{en?"Nature":"Natureza"}</div>
                      <div className="duel-card down"><NatureCard nature={reveal.nature} biome={reveal.nature.biome} lang={lang} /></div>
                      <div className="duel-val" style={{color:col}}>{fval(neff)} <span className="muted" style={{fontSize:11}}>{rc.unit}</span></div>
                      {nBoost ? <div className="muted duel-base">{(en?"base ":"base ")+fval(nbase)}</div> : null}
                      <div>{reveal.nature.biome_bonus?tag((en?"biome ":"bioma ")+sd(nBio),"#2f9e57"):null}</div>
                    </div>
                  </div>
                  {(pBoost||nBoost) && <div className="muted" style={{fontSize:10,textAlign:"center",marginTop:8,lineHeight:1.5}}>
                    {reveal.dir==="low"
                      ? (en?"Each bonus is worth 15% and lowers the value, since the lowest wins this round.":"Cada bônus vale 15% e reduz o valor, porque nesta rodada vence o menor.")
                      : (en?"Each bonus is worth 15% and raises the value, since the highest wins this round.":"Cada bônus vale 15% e aumenta o valor, porque nesta rodada vence o maior.")}</div>}
                  <div style={{textAlign:"center",marginTop:8,color:col,fontWeight:700}}>
                    {tie?(en?"Tie":"Empate"):(win?(en?"You won the round":"Você venceu a rodada"):(en?"Nature won the round":"A natureza venceu a rodada"))}</div>
                  {!final && <button onClick={()=>setReveal(null)} style={{width:"100%",marginTop:12}}>{en?"Next round":"Próxima rodada"}</button>}
                </div>
              );
            })() : (
              <div>
                <div className="muted small">{en?"Round":"Rodada"} {match.roundNo} / {match.rounds}</div>
                <div style={{fontWeight:800,fontSize:18,margin:"2px 0",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  {ci.label}
                  {cbi && <span className="badge" style={{background:cbi.c,color:"#fff",fontSize:11}}>{(en?"in ":"no ")+cbi.s}</span>}
                </div>
                <div className="muted small">{ci.sub} · {match.challenge.dir==="low"?(en?"lowest wins":"vence o menor"):(en?"highest wins":"vence o maior")}{cbi?" · "+(en?"matching biome gets a bonus":"bioma igual ganha bônus"):""}</div>
              </div>
            )}
          </div>

          {!reveal && !final && (
            <div>
              <div className="bhand">
                {hand.map(c=>{
                  const av=(c.attributes&&c.attributes[match.challenge.attr])?c.attributes[match.challenge.attr].value:null;
                  const bs=c.primary_biome?biomeStyle(c.primary_biome):null;
                  const matchBiome = cbi && bs && bs.s===cbi.s;
                  return (
                    <div key={c.card_id} className={"bhand-card"+(matchBiome?" match":"")}
                         onClick={()=>{ if(!busy) choose(c); }}
                         onTouchStart={e=>{ handStartY.current=e.touches[0].clientY; }}
                         onTouchEnd={e=>{ const dy=e.changedTouches[0].clientY-handStartY.current; if(dy<-40 && !busy) choose(c); }}>
                      {matchBiome && <span className="bhand-bonus">{en?"biome +15%":"bioma +15%"}</span>}
                      <CardFace c={c} lang={lang} />
                    </div>
                  );
                })}
              </div>
              <div className="bhand-hint">{en?"Tap or drag a card up to play it":"Toque ou arraste uma carta para cima para jogar"}</div>
            </div>
          )}
        </div>
        );
      })()}

      {final && (
        <div className="panel" style={{borderColor:"var(--accent)",marginTop:12}}>
          <div className="section-title">{
            final.result==="vitoria"?(en?"Victory":"Vitória"):
            final.result==="derrota"?(en?"Defeat":"Derrota"):(en?"Draw":"Empate")}</div>
          <p className="small" style={{marginTop:0}}>{en?"Final score":"Placar final"}: {scores.player} · {scores.nature}</p>
          {final.reward>0
            ? <p className="ok" style={{marginTop:0}}>{en?"Reward":"Recompensa"}: +{final.reward} {en?"coins":"moedas"}</p>
            : (final.limit ? <p className="muted small">{en?"Daily reward limit reached. You can keep playing for fun.":"Limite diário de recompensas atingido. Você pode seguir jogando por diversão."}</p> : null)}
          <button onClick={reset} style={{width:"100%",marginTop:6}}>{en?"Play again":"Jogar de novo"}</button>
        </div>
      )}

      {(picked && question) && (
        <div className="overlay">
          <div className="modal" style={{maxWidth:440}}>
            <div className="panel" style={{marginBottom:0}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span className="muted small">{en?"Knowledge bonus":"Bônus de conhecimento"} · {picked.common_name}</span>
                <span className="timer" style={{color: secs<=5 ? "#ff7b72" : "var(--text)"}}>{secs>0?secs+"s":(en?"Time!":"Tempo!")}</span>
              </div>
              <div style={{height:4,background:"var(--line)",borderRadius:3,marginBottom:10,overflow:"hidden"}}>
                <div style={{height:"100%",width:(Math.max(0,secs)/15*100)+"%",background:secs<=5?"#ff7b72":"var(--accent)",transition:"width 1s linear"}}></div>
              </div>
              <div style={{fontWeight:700,marginBottom:10}}>{question.text}</div>
              <div>
                {question.options.map(o=>{
                  const isChosen = chosen===o.id;
                  const isCorrectOpt = correctOpt && o.id===correctOpt;
                  const showFb = answered!==null && (isChosen || isCorrectOpt);
                  const stl = {display:"block",width:"100%",textAlign:"left",marginBottom:8};
                  if(showFb){ const c=isCorrectOpt?"#2f9e57":"#c0413c"; stl.background=c+"22"; stl.borderColor=c; stl.color=c; stl.fontWeight=700; }
                  else if(chosen){ stl.opacity=.5; }
                  const mark = (answered!==null) ? (isCorrectOpt?"  ✓":(isChosen&&!answered?"  ✗":"")) : "";
                  return (
                    <button key={o.id} className="ghost" disabled={busy||!!chosen} style={stl} onClick={()=>answer(picked, o)}>
                      {o.text}{mark}
                    </button>
                  );
                })}
              </div>
              <button className="ghost" disabled={busy||!!chosen} style={{width:"100%",opacity:.6}} onClick={()=>resolve(picked, null, null)}>{en?"Skip (no bonus)":"Pular (sem bônus)"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ===================== ABA RANQUEADA =====================
function RankedTab({ lang, collection, onChanged }){
  const en=lang==="en";
  const [me,setMe]=useState(null);
  const [ranking,setRanking]=useState(null);
  const [team,setTeam]=useState(null);
  const [selecting,setSelecting]=useState(false);
  const [selected,setSelected]=useState([]);
  const [result,setResult]=useState(null);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [history,setHistory]=useState([]);
  const [showHow,setShowHow]=useState(false);
  const [f,setF]=useState({q:"",rarity:"",biome:"",sort:"name"});

  async function loadAll(){
    const { data:u }=await db.auth.getUser();
    const uid=u&&u.user?u.user.id:null; setMe(uid);
    const { data:rk }=await db.from("v_ranked_ranking").select("*").order("rating",{ascending:false}).limit(50);
    setRanking(rk||[]);
    const { data:t }=await db.from("ranked_teams").select("*").maybeSingle();
    setTeam(t||null);
    const { data:h }=await db.from("v_ranked_history").select("*").order("created_at",{ascending:false}).limit(30);
    setHistory(h||[]);
  }
  useEffect(()=>{ loadAll(); },[]);

  function toggle(id){ setErr(""); setSelected(s=> s.includes(id)? s.filter(x=>x!==id) : (s.length>=5? s : [...s,id])); }

  async function saveTeam(){
    if(selected.length!==5){ setErr(en?"Pick exactly 5 cards.":"Escolha exatamente 5 cartas."); return; }
    setBusy(true); setErr("");
    try{
      const { error }=await db.rpc("app_set_ranked_team",{ p_cards:selected });
      if(error) throw error;
      setSelecting(false); setSelected([]); setResult(null); await loadAll();
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  async function playRanked(){
    setBusy(true); setErr(""); setResult(null);
    try{
      const { data, error }=await db.rpc("app_ranked_play");
      if(error) throw error;
      setResult(data); await loadAll(); if(onChanged) onChanged();
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }

  if(ranking===null) return <p className="muted">{en?"Loading...":"Carregando..."}</p>;

  const intro=(
    <div className="panel">
      <div className="section-title">{en?"Ranked":"Ranqueada"}</div>
      <p className="small" style={{marginTop:0,marginBottom:0}}>{en
        ? "Set a team of 5 cards. Each ranked match is played asynchronously against another player's team, using the biome bonus. Your rating moves by the Elo system. There is no live knowledge bonus here."
        : "Defina um time de 5 cartas. Cada partida ranqueada é disputada de forma assíncrona contra o time de outro jogador, usando o bônus de bioma. Seu rating sobe e desce pelo sistema Elo. Aqui não existe o bônus de conhecimento ao vivo."}</p>
    </div>
  );

  if(selecting || team===null){
    return (
      <div>
        {intro}
        {collection.length<5 ? (
          <div className="panel"><p className="muted" style={{margin:0}}>{en?"You need at least 5 cards. Open some packs first.":"Você precisa de pelo menos 5 cartas. Abra alguns pacotes antes."}</p></div>
        ) : (
          <div className="panel">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div className="section-title" style={{margin:0}}>{team===null?(en?"Set your team":"Defina seu time"):(en?"Edit your team":"Editar seu time")}</div>
              <span className="muted small">{selected.length} / 5</span>
            </div>
            <SelectedRow ids={selected} collection={collection} onRemove={toggle} en={en} />
            {err && <div className="err">{err}</div>}
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <button onClick={saveTeam} disabled={busy||selected.length!==5} style={{flex:1}}>{busy?(en?"Saving...":"Salvando..."):(en?"Save team":"Salvar time")}</button>
              {team!==null && <button className="ghost" onClick={()=>{setSelecting(false);setSelected([]);setErr("");}} disabled={busy}>{en?"Cancel":"Cancelar"}</button>}
            </div>
            <FilterBar f={f} setF={setF} biomes={biomeOptions(collection)} en={en} artFilter
              sortOptions={[["name",en?"Name":"Nome"],["float_desc",en?"Higher float":"Float maior"],["float_asc",en?"Lower float":"Float menor"],["mass_desc",en?"Higher mass":"Maior massa"],["mass_asc",en?"Lower mass":"Menor massa"],["length_desc",en?"Higher length":"Maior comprimento"],["length_asc",en?"Lower length":"Menor comprimento"],["lifespan_desc",en?"Higher lifespan":"Maior longevidade"],["lifespan_asc",en?"Lower lifespan":"Menor longevidade"]]} />
            <div>
              {filterCards(collection,f).map(c=>(
                <PickCard key={c.card_id} c={c} selected={selected.includes(c.card_id)} onClick={()=>toggle(c.card_id)} en={en} />
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  const myRank = ranking.findIndex(r=>r.player_id===me);

  const steps = en ? [
    "Set your team: pick 5 cards. The game saves a snapshot of them, with each card's traits and biome, at the moment you save.",
    "Asynchronous match: when you play, the system draws another player who also has a team and simulates the match. The opponent does not need to be online.",
    "The five rounds: each round brings a challenge based on a real trait. Sometimes the highest value wins, sometimes the lowest. Some rounds happen in a biome.",
    "Automatic pick: each side enters the card that best answers that round's challenge. In ranked, the system makes this choice from your saved team.",
    "Biome bonus: if the played card belongs to the challenge's biome, it gets a 15% boost in that comparison. It works for both sides. There is no knowledge bonus here, since no one answers questions live.",
    "Match result: whoever wins more of the five rounds wins the match. A draw is possible.",
    "Elo rating: your rating rises when you win and falls when you lose. Beating a higher ranked player is worth more, and losing to a lower ranked one costs more. The rating never drops below 100.",
    "Worth knowing: because matches are asynchronous, other players can draw you as their opponent when they play. So your rating can change even when you are not playing. That is expected, and the history records those matches too.",
    "Change your team: you can edit it whenever you want. The new snapshot applies to the next matches, yours and those of whoever faces you."
  ] : [
    "Monte seu time: escolha 5 cartas. O jogo guarda um retrato delas, com os atributos e o bioma de cada uma, no momento em que você salva.",
    "Partida assíncrona: quando você joga, o sistema sorteia outro jogador que também tenha time e simula a disputa. O oponente não precisa estar online.",
    "As cinco rodadas: cada rodada traz um desafio baseado numa característica real. Às vezes vence o maior valor, às vezes o menor. Parte das rodadas acontece num bioma.",
    "Escolha automática: cada lado entra com a carta que melhor responde ao desafio daquela rodada. No ranqueado essa escolha é feita pelo sistema, a partir do seu time salvo.",
    "Bônus de bioma: se a carta jogada é do bioma do desafio, ela ganha um reforço de 15% naquela comparação. Vale para os dois lados. Aqui não há bônus de conhecimento, porque ninguém responde perguntas ao vivo.",
    "Resultado da partida: vence quem ganhar mais das cinco rodadas. Pode haver empate.",
    "Rating pelo Elo: seu rating sobe quando você vence e cai quando perde. Ganhar de alguém mais bem ranqueado rende mais, e perder para alguém abaixo custa mais. O rating nunca cai abaixo de 100.",
    "Vale lembrar: como as partidas são assíncronas, outros jogadores podem te sortear como oponente quando jogam. Por isso seu rating pode mudar mesmo quando você não está jogando. É esperado, e o histórico também registra essas partidas.",
    "Trocar o time: você pode editar quando quiser. O novo retrato passa a valer para as próximas partidas, suas e as de quem te enfrentar."
  ];

  const howPanel=(
    <div className="panel">
      <div onClick={()=>setShowHow(v=>!v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
        <div className="section-title" style={{margin:0}}>{en?"How ranked works":"Como funciona o ranqueado"}</div>
        <span className="muted" style={{fontSize:20,lineHeight:1}}>{showHow?"−":"+"}</span>
      </div>
      {showHow && (
        <div style={{marginTop:10,display:"grid",gap:8}}>
          {steps.map((s,i)=>(
            <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <span className="badge" style={{background:"var(--accent)",color:"#f7f2e8",minWidth:22,textAlign:"center",flexShrink:0}}>{i+1}</span>
              <span className="small" style={{flex:1}}>{s}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  const historyPanel=(
    <div className="panel">
      <div className="section-title">{en?"Your match history":"Seu histórico de partidas"}</div>
      {history.length===0 ? <p className="muted" style={{margin:0}}>{en?"No ranked matches yet.":"Você ainda não jogou partidas ranqueadas."}</p> : (()=>{
        const pts=history.slice().reverse().map(h=>h.rating_after);
        const W=280,H=48,pad=4;
        const min=Math.min(...pts), max=Math.max(...pts), span=(max-min)||1;
        const xAt=i=> pts.length<=1 ? W/2 : pad + i*(W-2*pad)/(pts.length-1);
        const yAt=v=> H-pad - (v-min)/span*(H-2*pad);
        const coords=pts.map((v,i)=>xAt(i).toFixed(1)+","+yAt(v).toFixed(1)).join(" ");
        const lastI=pts.length-1;
        return (
          <div>
            <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:H,display:"block",marginBottom:10}}>
              <polyline points={coords} fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
              <circle cx={xAt(lastI)} cy={yAt(pts[lastI])} r="3" fill="var(--accent)" />
            </svg>
            <div style={{display:"grid",gap:4}}>
              {history.map(h=>{
                const win=h.my_result==="vitoria", tie=h.my_result==="empate";
                const col=tie?"#9aa0a6":(win?"#3fb950":"#f0857d");
                const d=h.rating_after-h.rating_before;
                const dt=new Date(h.created_at);
                const ds=dt.toLocaleDateString(en?"en-US":"pt-BR",{day:"2-digit",month:"2-digit"})+" "+dt.toLocaleTimeString(en?"en-US":"pt-BR",{hour:"2-digit",minute:"2-digit"});
                return (
                  <div key={h.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderRadius:8,border:"1px solid var(--line)"}}>
                    <span style={{width:8,height:8,borderRadius:8,background:col,flexShrink:0}}></span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                        {win?(en?"Win":"Vitória"):tie?(en?"Draw":"Empate"):(en?"Loss":"Derrota")} {h.my_score}-{h.opp_score} · vs {h.opponent||(en?"player":"jogador")}
                      </div>
                      <div className="muted small">{ds}{h.i_started?"":" · "+(en?"they challenged you":"te desafiaram")}</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontWeight:700}}>{h.rating_after}</div>
                      <div className="small" style={{color:d>=0?"#3fb950":"#f0857d"}}>{d>=0?"+":""}{d}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}
    </div>
  );

  return (
    <div>
      {intro}

      {howPanel}

      <div className="panel">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div className="muted small">{en?"Your rating":"Seu rating"}</div>
            <div style={{fontSize:26,fontWeight:800}}>{team.rating}</div>
            <div className="muted small">{team.wins}{en?"W":"V"} · {team.losses}{en?"L":"D"} · {team.draws}{en?"D":"E"}{myRank>=0?" · #"+(myRank+1):""}</div>
          </div>
          <button className="ghost" onClick={()=>{ const ids=((team&&team.team)?team.team.map(x=>x.card_id):[]).filter(id=>(collection||[]).some(c=>c.card_id===id)); setSelected(ids); setSelecting(true); }} disabled={busy}>{en?"Edit team":"Editar time"}</button>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:10}}>
          {(team.team||[]).map((c,i)=>{ const bs=c.biome?biomeStyle(c.biome):null; return (
            <span key={i} className="badge" style={{background:"var(--panel2)",border:"1px solid var(--line)"}}>{c.name}{bs?" ":""}{bs&&<b style={{color:bs.c}}>{bs.s}</b>}</span>
          );})}
        </div>
        {err && <div className="err" style={{marginTop:10}}>{err}</div>}
        <button onClick={playRanked} disabled={busy} style={{width:"100%",marginTop:12}}>{busy?(en?"Playing...":"Jogando..."):(en?"Play ranked match":"Jogar partida ranqueada")}</button>
      </div>

      {result && (()=>{
        const win=result.result==="vitoria", tie=result.result==="empate";
        const col=tie?"#9aa0a6":(win?"#3fb950":"#f0857d");
        return (
          <div className="panel" style={{borderColor:col}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div className="section-title" style={{margin:0,color:col}}>{win?(en?"Victory":"Vitória"):tie?(en?"Draw":"Empate"):(en?"Defeat":"Derrota")}</div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:800,fontSize:18}}>{result.a_score} · {result.b_score}</div>
                <div className="muted small">vs {result.opponent} ({result.opponent_rating})</div>
              </div>
            </div>
            <div className="small" style={{marginTop:4}}>Rating: {result.rating_before} → <b>{result.rating_after}</b> <span style={{color:result.delta>=0?"#3fb950":"#f0857d"}}>({result.delta>=0?"+":""}{result.delta})</span></div>
            <div style={{marginTop:10,display:"grid",gap:6}}>
              {(result.log||[]).map(rd=>{ const rc=challengeInfo(rd.attr,rd.dir,en); const w=rd.winner; const wc=w==="e"?"#9aa0a6":(w==="a"?"#3fb950":"#f0857d");
                return (
                  <div key={rd.round_no} style={{border:"1px solid var(--line)",borderRadius:8,padding:"6px 8px"}}>
                    <div className="muted small" style={{marginBottom:2}}>{rc.label}{rd.biome?" · "+biomeStyle(rd.biome).s:""}</div>
                    <div style={{display:"flex",alignItems:"center",gap:6,fontSize:13}}>
                      <span style={{flex:1}}>{rd.a.name} <b>{fmtNum(rd.a.value)}</b>{rd.a.biome_bonus?" ✓":""}</span>
                      <span style={{color:wc,fontWeight:800}}>{w==="e"?"=":(w==="a"?"›":"‹")}</span>
                      <span style={{flex:1,textAlign:"right"}}>{rd.b.biome_bonus?"✓ ":""}<b>{fmtNum(rd.b.value)}</b> {rd.b.name}</span>
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="muted small" style={{marginTop:8}}>{en?"✓ marks a biome bonus. You are on the left.":"✓ indica bônus de bioma. Você está à esquerda."}</div>
          </div>
        );
      })()}

      {historyPanel}

      <div className="panel">
        <div className="section-title">{en?"Leaderboard":"Ranking"}</div>
        {ranking.length===0 ? <p className="muted" style={{margin:0}}>{en?"No ranked players yet.":"Ainda não há jogadores ranqueados."}</p> : (
          <div style={{display:"grid",gap:4}}>
            {ranking.map((r,i)=>(
              <div key={r.player_id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderRadius:8,background:r.player_id===me?"rgba(80,200,120,.12)":"transparent",border:"1px solid "+(r.player_id===me?"#3fb950":"transparent")}}>
                <span className="muted small" style={{width:28}}>#{i+1}</span>
                <span style={{flex:1,fontWeight:r.player_id===me?700:400}}>{r.username||(en?"player":"jogador")}</span>
                <span className="muted small">{r.wins}-{r.losses}-{r.draws}</span>
                <span style={{fontWeight:800,width:48,textAlign:"right"}}>{r.rating}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ===================== ABA APOIADOR =====================
function ApoiadorTab({ lang }) {
  const en = lang==="en";
  const tiers = en ? [
    {name:"Seed", benefits:["Supporter badge on your profile","One extra free pack per week","Your name in the credits"]},
    {name:"Sprout", benefits:["Everything in Seed","An exclusive card back","Early access to new species"]},
    {name:"Guardian", benefits:["Everything in Sprout","An exclusive card frame","Early access to features","A monthly extra pack"]},
    {name:"Patron", benefits:["Everything in Guardian","The full set of cosmetics","A special profile seal","A larger share to conservation and photographers"]},
  ] : [
    {name:"Semente", benefits:["Selo de apoiador no perfil","Um pacote grátis a mais por semana","Seu nome nos créditos"]},
    {name:"Broto", benefits:["Tudo do Semente","Um verso de carta exclusivo","Acesso antecipado a novas espécies"]},
    {name:"Guardião", benefits:["Tudo do Broto","Uma moldura de carta exclusiva","Acesso antecipado a recursos","Um pacote extra por mês"]},

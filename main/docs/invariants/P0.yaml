# Invariantes P0 — WildLens
# Bloqueiam qualquer exposição pública.
# Cada item deve ter: pre, post, invariant, testes.

meta:
  versao: 1
  ultima_atualizacao: 2026-10-06
  autoridade: PostgreSQL
  regra: "Cliente nunca é autoridade sobre estado, economia ou permissão."

quiz:
  - id: QUIZ-01
    descricao: Sessão de quiz tem exatamente 5 questões
    pre: Usuário autenticado
    post: Sessão criada com exatamente 5 linhas em quiz_session_answers
    invariant: app_start_quiz aceita apenas p_num_questions = 5
    testes:
      - entrada: "select app_start_quiz(5)"
        esperado: "sucesso + session_id"
      - entrada: "select app_start_quiz(6)"
        esperado: "erro 'deve conter exatamente 5 questões'"
      - entrada: "select app_start_quiz(0)"
        esperado: "erro"
      - entrada: "select app_start_quiz(-1)"
        esperado: "erro"
      - entrada: "select app_start_quiz(100)"
        esperado: "erro"
      - entrada: "select app_start_quiz(null)"
        esperado: "erro"

  - id: QUIZ-02
    descricao: Resposta é imutável após persistida
    pre: Existe linha em quiz_session_answers com selected_option_id null
    post: selected_option_id preenchido; nunca mais alterável
    invariant: selected_option_id não pode ser sobrescrito
    testes:
      - entrada: "app_answer_quiz(s, q, A) → depois app_answer_quiz(s, q, B)"
        esperado: "primeira OK, segunda erro 'já respondida'"
      - entrada: "UPDATE direto em quiz_session_answers"
        esperado: "bloqueado por RLS"
      - entrada: "2x app_answer_quiz(s, q, A) em paralelo"
        esperado: "exatamente 1 sucesso"

  - id: QUIZ-03
    descricao: Tempo usado é medido server-side
    pre: answered_at registrado na linha
    post: is_correct usa (answered_at - session_started_at), não p_time_taken
    invariant: p_time_taken do cliente é telemetria, nunca autoridade
    testes:
      - entrada: "app_answer_quiz com p_time_taken=0"
        esperado: "tempo real medido; não é bônus automático"
      - entrada: "app_answer_quiz após time_limit real"
        esperado: "is_correct=false"

  - id: QUIZ-04
    descricao: Recompensa deriva das respostas persistidas
    pre: Sessão finalizada
    post: reward = 10 * count(answers where is_correct)
    invariant: nenhuma recompensa fora do ledger
    testes:
      - entrada: "sessão com 5 acertos → finish"
        esperado: "50 moedas + entry em currency_ledger"
      - entrada: "sessão com 3 acertos → finish"
        esperado: "30 moedas + entry em currency_ledger"
      - entrada: "finish sem respostas"
        esperado: "0 moedas (verificar e documentar)"

  - id: QUIZ-05
    descricao: Limite diário é resistente a concorrência
    pre: Usuário no limite diário - 1
    post: Apenas 1 sessão criada
    invariant: advisory lock por usuário antes de contar
    testes:
      - entrada: "2x app_start_quiz paralelo no limite"
        esperado: "1 sucesso, 1 'limite atingido'"

  - id: QUIZ-06
    descricao: Ownership de sessão
    pre: Sessão pertence ao usuário A
    post: Usuário B não lê, não responde, não finaliza
    invariant: auth.uid() validado em todas as operações de sessão
    testes:
      - entrada: "B chama app_finish_quiz(sessao_de_A)"
        esperado: "erro 'sessão não encontrada'"
      - entrada: "B chama app_answer_quiz(sessao_de_A, ...)"
        esperado: "erro"

gates:
  - id: GATE-01
    descricao: Erro em status jurídico bloqueia entrada
    pre: app_legal_status_v2 retorna erro ou timeout
    post: UI em estado error; app não avança
    invariant: erro nunca é convertido em accepted=true
    testes:
      - entrada: "simular 500 em app_legal_status_v2"
        esperado: "UI bloqueia com mensagem + retry"
      - entrada: "simular timeout"
        esperado: "UI bloqueia"
      - entrada: "simular retorno null"
        esperado: "UI bloqueia"

  - id: GATE-02
    descricao: NDA fail-closed
    pre: Leitura de profiles falha
    post: UI bloqueada; não assume NDA aceito
    invariant: profile null ≠ NDA aceito
    testes:
      - entrada: "simular erro em select profiles"
        esperado: "UI em error state"

  - id: GATE-03
    descricao: app_my_access default-deny
    pre: app_my_access falha ou retorna null
    post: show_market=false, can_buy=false, show_ranked=false, can_ranked=false
    invariant: ausência de autorização não autoriza
    testes:
      - entrada: "app_my_access = null"
        esperado: "tudo desabilitado"
      - entrada: "app_my_access erro"
        esperado: "tudo desabilitado"

  - id: GATE-04
    descricao: Alpha welcome fail-closed
    pre: app_alpha_status falha
    post: não concede, não presume resgatado
    invariant: erro em alpha status não cria estado incorreto
    testes:
      - entrada: "erro em app_alpha_status"
        esperado: "UI mostra 'não foi possível verificar'"

seguranca:
  - id: SEC-01
    descricao: service_role não está exposto
    pre: -
    post: -
    invariant: nenhuma ocorrência de 'service_role' ou JWT de service no client
    testes:
      - entrada: "grep -r 'service_role' supabase/"
        esperado: "0 ocorrências"
      - entrada: "grep -rE 'eyJhbGciOiJIUzI1NiI' supabase/"
        esperado: "0 ocorrências em bundle/client"